<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLW BOOKER</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eefb;--card:#fff;--tx:#1a1030;--mut:#6b5e86;--ln:#d9cdee;--p:#6A0DAD;--b:#00A6FB;--o:#FF6B00;--g:#d4a017;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07050d;--card:#130c22;--tx:#f4eeff;--mut:#9b8bb8;--ln:#2b1b47;--g:#ffd24a}}
:root[data-theme="dark"]{--bg:#07050d;--card:#130c22;--tx:#f4eeff;--mut:#9b8bb8;--ln:#2b1b47;--g:#ffd24a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:110px}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.06em;margin:0;font-weight:400}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
.logo{padding:10px 14px 0;font-size:30px;background:linear-gradient(90deg,#b44dff,#00A6FB,#FF6B00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 24px #6A0DAD55}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--mut);padding:7px 11px;border-radius:99px;font:600 13px Inter,sans-serif;cursor:pointer}
nav button.on{color:#fff;background:linear-gradient(90deg,#6A0DAD,#b4128f);border-color:transparent;box-shadow:0 0 14px #6A0DAD99}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--c,var(--p));border-radius:14px;padding:12px;margin-bottom:10px;overflow-wrap:anywhere}
.title-click{cursor:pointer}
.card h3{font-size:22px}
.sec{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.08em;margin:18px 0 8px;color:var(--g)}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--c,var(--p));color:#fff;margin-right:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.hero .card{margin:0;border-left-width:1px;background:linear-gradient(160deg,var(--card),#2a0a4a55)}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit;margin:3px 0}
textarea{min-height:64px}
.btn{border:0;border-radius:12px;padding:11px 14px;font:800 14px Inter,sans-serif;cursor:pointer;color:#fff;background:linear-gradient(90deg,#6A0DAD,#b4128f)}
.btn.g{background:#1f8a4c}.btn.r{background:#b3261e}.btn.o{background:#FF6B00}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.fabs{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;gap:8px;align-items:center}
.fab,.fabn{padding:15px 17px;border-radius:99px;font:800 15px Inter,sans-serif;box-shadow:0 0 26px #b4128fcc,0 6px 20px #0008}
.fabn{background:linear-gradient(90deg,#d4a017,#FF6B00);color:#1a1030}.fabu{background:linear-gradient(90deg,#FF6B00,#b4128f);color:#fff;padding:15px 14px}
.pad{min-height:46vh;padding:8px 12px;border:1px solid #d9c98a;border-radius:10px;background-color:#fffbe6;color:#2a2312;background-image:repeating-linear-gradient(transparent,transparent 27px,#e6d9a0 27px,#e6d9a0 28px);background-attachment:local;font:16px/28px 'Courier New',monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pad{background-color:#1d1730;color:var(--tx);border-color:var(--ln);background-image:repeating-linear-gradient(transparent,transparent 27px,#2f2450 27px,#2f2450 28px)}}
:root[data-theme="dark"] .pad{background-color:#1d1730;color:var(--tx);border-color:var(--ln);background-image:repeating-linear-gradient(transparent,transparent 27px,#2f2450 27px,#2f2450 28px)}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.pgb{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:800 14px Inter,sans-serif;cursor:pointer}
.pgb.on{background:linear-gradient(90deg,#6A0DAD,#b4128f);color:#fff;border-color:transparent}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px))}
.drop{border:2px dashed var(--p);border-radius:16px;padding:26px 12px;text-align:center;margin:10px 0;background:#6A0DAD14}
.bub{padding:9px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{background:#6A0DAD;color:#fff;margin-left:24px}.bub.a{background:var(--card);border:1px solid var(--ln);margin-right:24px}
.fact{color:#3ddc84;font-weight:800}.sug{color:var(--o);font-weight:800}
.st{color:var(--g)}
.spin{animation:pl 1.2s infinite}@keyframes pl{50%{opacity:.35}}
.toast{position:fixed;left:12px;right:12px;bottom:90px;z-index:30;background:linear-gradient(90deg,#6A0DAD,#00A6FB);color:#fff;padding:14px;border-radius:14px;font-weight:800;text-align:center;box-shadow:0 0 30px #6A0DADaa}
.lk{color:var(--g);cursor:pointer;text-decoration:underline dotted}
.pcs{display:flex;gap:6px;align-items:center}.pcs input{flex:1}.pcx{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;width:38px;height:38px;cursor:pointer;font-weight:800}
.pcvs{text-align:center;font:400 20px 'Bebas Neue',Impact,sans-serif;letter-spacing:.25em;color:var(--g);margin:0}
.pcb{padding:6px 10px}.pcm{border-left-width:8px}.pcn{font:400 20px 'Bebas Neue',Impact,sans-serif;letter-spacing:.08em;color:var(--g);flex:1}
.pcw{font-size:13px;margin-top:4px;color:var(--o);font-weight:600}
.tt{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}.tt th,.tt td{padding:3px 5px;border-bottom:1px solid var(--ln);text-align:center}.tt td:nth-child(2),.tt th:nth-child(2){text-align:left}
</style>
</head>
<body>
<header><button class="btn s" id="pdb" title="Planos (bloco de notas) • Ctrl+P" style="position:absolute;right:62px;top:10px;padding:8px 12px" onclick="openPlans()">📝</button><button class="btn s" id="qsb" title="Buscar lutador" style="position:absolute;right:10px;top:10px;padding:8px 12px" onclick="openQS()">🔎</button><div class="logo"><h1 style="font-size:34px">PLW BOOKER</h1></div><nav id="nav"></nav></header>
<main id="v"></main>
<div class="fabs"><button class="btn fabn" id="fabn" title="Ctrl+P" onclick="openPlans()">📝 PLANOS</button><button class="btn fabn fabu" id="fabu" title="Atualizar save da pasta" onclick="quickUpdateSave()">🔄 ATUALIZAR</button><button class="btn fab" id="fab">📸 ENVIAR PRINT</button></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TITLES=[['PLW World Championship','GLOBAL'],['PLW World Tag Team Championship','GLOBAL'],['PLWAR Crown Championship','PLWAR'],['PLWAR Ace Championship','PLWAR'],['PLW Motion Next Level Championship','MOTION'],['PLW Motion Rising Championship','MOTION'],['PLW Show Off Championship','SHOW OFF']];
const CAL0=['COLISEUM','EYE TO EYE','BLACKOUT','HIGH OFF LIFE','PURPLE REIGN','','NEW LEVEL','AUGUST MADNESS','RAINDROPS','BEAST MODE','PURPLE COLLISION','FINAL BATTLE'];
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const TABS=[['dash','🏠','Dashboard'],['shows','📺','Shows'],['ppvs','🏟️','PPVs'],['roster','👥','Roster'],['champs','🏆','Champions'],['brands','🎨','Brands'],['tags','🤝','Tag Teams'],['facs','🔥','Factions'],['riv','⚔️','Rivalries'],['hist','📖','History'],['jj','🧠','J.J. Purple'],['hal','🤖','HAL Mercer'],['tony','🎩','Tony The Boss'],['dirk','📰','Dirk The Truth'],['plan','📝','Planos'],['sys','⚙️','Sistema']];
let S={events:[],titles:{},roster:{},stories:[],plans:[],cal:CAL0.slice(),nextShow:'',nextPPV:'',notes:{},month:''};
let tab='dash',db=null,sample=null,draft=null,edit=false,files=[],chats={jj:[],hal:[],tony:[],dirk:[],hist:[]},busy=false,q='',mode='show';
function bc(b){b=String(b||'').toUpperCase();if(b.includes('MOTION'))return'#00A6FB';if(b.includes('SHOW'))return'#FF6B00';if(b.includes('WAR'))return'#6A0DAD';return'#d4a017'}
function norm(x){x=x||{};return{plans:x.plans||[],events:x.events||[],titles:x.titles||{},roster:x.roster||{},stories:x.stories||[],planBoard:x.planBoard||{mensal:'',anual:'',ppv:''},cal:x.cal&&x.cal.length===12?x.cal:CAL0.slice(),nextShow:x.nextShow||'',nextPPV:x.nextPPV||'',notes:x.notes||{},month:x.month||'',convs:(x.convs||[]).map((c,i)=>c.id?c:{...c,id:Date.now()+i}),ppvPlans:x.ppvPlans||{},hid:x.hid||[],end:x.end||{}}}
function loadLocal(){try{const j=localStorage.getItem('plw-save');if(j)S=norm(JSON.parse(j))}catch(e){}}
function persist(){const j=JSON.stringify(S);try{localStorage.setItem('plw-save',j)}catch(e){}if(db)db.doc('plw/save').set({json:j}).catch(()=>{})}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,ms||3500)}
function stars(r){if(r==null||r==='')return'';const n=parseFloat(r);if(isNaN(n))return esc(r);return'<span class="st">'+'★'.repeat(Math.floor(n))+(n%1>=.5?'½':'')+'</span>'}
function mline(m){const draw=/empate|draw/i.test(m.winner||'');const t=m.championship?` <span class="tag" style="--c:${bc(titleBrand(m.championship))}">🏆 ${esc(m.championship)}${m.title_change?' • MUDOU':''}</span>`:'';const main=draw?`<b>${esc((m.participants||[]).join(' vs '))}</b> terminou em empate`:`<b>${esc(m.winner)}</b> derrotou ${esc(m.loser||(m.participants||[]).filter(p=>p!==m.winner).join(', '))}`;return`<div class="card" style="--c:${bc(m.brand)}">${main} ${stars(m.rating)}<div class="mut">${esc(m.stipulation||'')}${m.notes?' • '+esc(m.notes):''}</div>${t}</div>`}
function titleBrand(n){const t=TITLES.find(x=>x[0]===n);return t?t[1]:''}
function allMatches(){const a=[];S.events.forEach(e=>(e.matches||[]).forEach(m=>a.push({...m,brand:e.brand,ev:e.name,date:e.date})));return a}
function gkey(s){return s.team||(s.names||[]).slice().sort().join(' × ')||(s.text||'').slice(0,30)}
function groups(type){const g={},H=S.hid||[];S.stories.filter(s=>s.type===type).forEach(s=>{const k=gkey(s);if(H.includes(type+'|'+k))return;(g[k]=g[k]||[]).push(s)});return g}
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]} ${t[2]}</button>`).join('')}
function go(t){tab=t;nav();render();scrollTo(0,0)}
function champCard(t){const c=S.titles[t[0]]||{};const last=(c.hist||[]).slice(-1)[0];const ri=Object.keys(S.roster).sort();const tg=Object.keys(groups('tag'));const i=TITLES.indexOf(t);
return`<div class="card" style="--c:${bc(t[1])}"><span class="tag" style="--c:${bc(t[1])}">${t[1]}</span><div class="mut">${esc(t[0])}</div><h3>${esc(c.champ||'VAGO')}</h3>${c.champ&&chB(c.champ)?`<div class="mut">📍 ${chB(c.champ)}</div>`:''}${last?`<div class="mut">desde ${esc(last.date||last.event||'')}</div>`:''}<select onchange="setChamp(${i},this.value)"><option value="">— trocar campeão —</option><option value="__vago">VAGO</option>${ri.length?`<optgroup label="Lutadores">${ri.map(n=>`<option>${esc(n)}</option>`).join('')}</optgroup>`:''}${tg.length?`<optgroup label="Tag teams">${tg.map(n=>`<option>${esc(n)}</option>`).join('')}</optgroup>`:''}<option value="__outro">Digitar outro nome...</option></select></div>`}
function storyHtml(k,list){const l=list[list.length-1];return`<div class="card"><h3>${esc(k)}</h3><div>${esc(l.text)}</div><div class="mut">${list.length} registro(s) • última: ${esc(l.event||'')}</div></div>`}
function vDash(){
const rv=Object.entries(groups('rivalry')).slice(-5).reverse();
const lm=allMatches().slice(-6).reverse();
const tc=[];S.events.forEach(e=>(e.matches||[]).forEach(m=>{if(m.title_change)tc.push({...m,ev:e.name})}));
return`<div class="card" style="--c:#b4128f"><div class="mut">PRÓXIMO PPV</div><h3>${nextPPV()}</h3></div>
<div class="sec">CAMPEÕES ATUAIS</div><div class="grid">${TITLES.map(champCard).join('')}</div>
<div class="sec">PRINCIPAIS RIVALIDADES</div>${rv.map(([k,l])=>storyHtml(k,l)).join('')||'<div class="mut">Nenhuma rivalidade registrada ainda.</div>'}
<div class="sec">ÚLTIMOS RESULTADOS</div>${lm.map(mline).join('')||'<div class="mut">Envie o primeiro print para começar o histórico.</div>'}
<div class="sec">ÚLTIMAS MUDANÇAS DE TÍTULO</div>${tc.slice(-4).reverse().map(m=>`<div class="card" style="--c:${bc(titleBrand(m.championship))}"><b>${esc(m.new_champion||m.winner)}</b> conquistou o ${esc(m.championship)}<div class="mut">${esc(m.ev)}</div></div>`).join('')||'<div class="mut">Sem trocas de cinturão registradas.</div>'}`}
function evCard(e){return`<details class="card" style="--c:${bc(e.brand)}"><summary><b>${esc(e.name)}</b> <span class="mut">${esc(e.date||'')} • ${esc(e.brand||'')}</span><div class="mut">Público ${esc(e.attendance??'—')} • Hype ${esc(e.hype??'—')} • Coins ${esc(e.coins??'—')} • ${stars(e.rating)}</div></summary>${(e.matches||[]).map(mline).join('')}${(e.stories||[]).map(s=>`<div class="mut">• ${esc(s.text)}</div>`).join('')}</details>`}
function vShows(){const l=S.events.filter(e=>e.type!=='ppv').slice().reverse();return`<div class="sec">SHOWS SEMANAIS</div>${l.map(evCard).join('')||'<div class="mut">Nenhum show registrado.</div>'}`}
function vPpvs(){const l=S.events.filter(e=>e.type==='ppv').slice().reverse();return`<div class="sec">CALENDÁRIO DE PPVs</div><div class="card">${S.cal.map((n,i)=>`<div class="row" style="align-items:center"><span class="mut" style="flex:0 0 90px">${MES[i]}</span><input value="${esc(n)}" placeholder="consultar a save" onchange="S.cal[${i}]=this.value;persist()"></div>`).join('')}</div><div class="sec">PPVs REALIZADOS</div>${l.map(evCard).join('')||'<div class="mut">Nenhum PPV registrado.</div>'}`}
function vChamps(){return`<div class="sec">CAMPEÕES</div>${TITLES.map(t=>{const c=S.titles[t[0]]||{};return champCard(t)+((c.hist||[]).length?`<details class="card" style="--c:${bc(t[1])}"><summary>Histórico (${c.hist.length})</summary>${c.hist.slice().reverse().map(h=>`<div>${esc(h.name)} <span class="mut">— ${esc(h.event||'')} ${esc(h.date||'')}</span></div>`).join('')}</details>`:'')}).join('')}`}
function vStory(type,title,ic){const g=Object.entries(groups(type));return`<div class="sec">${ic} ${title}</div>${g.map(([k,l])=>`<details class="card"><summary><h3 style="display:inline">${esc(k)}</h3> <span class="mut">${l.length} registro(s)</span></summary>${l.map(s=>`<div>• ${esc(s.text)} <span class="mut">(${esc(s.event||'')})</span></div>`).join('')}</details>`).join('')||'<div class="mut">Nada registrado ainda.</div>'}`}
function digest(){const ro=Object.entries(S.roster).map(([n,w])=>`${n} (${w.brand||'?'}${w.alignment?' '+w.alignment:''}${w.inj?' LESIONADO '+w.inj:''}) ${w.w}V-${w.l}D`).join('; ');
const ev=S.events.slice(-40).map(e=>`[${e.type==='ppv'?'PPV':'SHOW'}] ${e.name} ${e.date||''} ${e.brand||''} público:${e.attendance??'?'} hype:${e.hype??'?'} rating:${e.rating??'?'} coins:${e.coins??'?'}\n`+(e.matches||[]).map(m=>`  - ${m.participants?.join(' vs ')||''} | vencedor: ${m.winner||'?'} | ${m.stipulation||''} | ${m.championship||''}${m.title_change?' (MUDANÇA DE TÍTULO)':''} | ${m.rating??''}★ ${m.notes||''}`).join('\n')).join('\n');
const st=S.stories.slice(-80).map(s=>`(${s.type}) ${(s.names||[]).join(', ')}: ${s.text} [${s.event||''}]`).join('\n');
const ti=TITLES.map(t=>`${t[0]}: ${(S.titles[t[0]]||{}).champ||'vago'}`).join('\n');
return`CAMPEÕES:\n${ti}\n\nROSTER:\n${ro||'vazio'}\n\nEVENTOS:\n${ev||'nenhum'}\n\nSTORYLINES:\n${st||'nenhuma'}\n\nCALENDÁRIO PPV: ${S.cal.map((n,i)=>MES[i]+': '+(n||'?')).join(', ')}\n\nPLANOS (rascunhos do usuário, são SUGESTÕES e NÃO fatos): ${S.plans.map(p=>p.t+': '+p.x).join(' | ')||'nenhum'}\n\nNOTAS POR LUTADOR (planos = sugestões): ${Object.entries(S.notes||{}).filter(([,v])=>v.cur||v.plan).map(([n,v])=>n+' | mês: '+v.cur+' | plano: '+v.plan).join(' || ')||'nenhuma'}`.slice(0,K.engine==='ollama'?8000:58000)}
function bkNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
/* Acha lutadores citados na pergunta: nome completo OU qualquer parte do nome (ex.: "Moxley" -> "Jon Moxley"). */
function bkMentioned(q){
 const nq=' '+bkNorm(q)+' ',full=[],part=[];
 Object.keys(S.roster).forEach(n=>{
  const nn=bkNorm(n);
  if(!nn)return;
  if(nq.includes(' '+nn+' '))full.push(n);
  else if(nn.split(' ').some(tk=>tk.length>=4&&nq.includes(' '+tk+' ')))part.push(n);
 });
 return [...full,...part].slice(0,4);
}
function bkFocus(n){
 try{
  const w=S.roster[n]||{},p=pst(n);
  const tt=TITLES.filter(t=>hasC((S.titles[t[0]]||{}).champ,n)).map(t=>t[0]);
  const l=[`${n} — LUTADOR DA PLW (${w.brand||'?'} ${w.alignment||''} ${w.w||0}V-${w.l||0}D${w.status&&w.status!=='ativo'?' '+w.status:''}${w.inj?' lesão:'+w.inj:''})`];
  l.push('  títulos atuais: '+(tt.join(', ')||'nenhum'));
  const rec=p.mm.slice(-4).map(m=>{const r=sd(m,n);const tt=m.championship?(r==='w'?(m.title_change?' — GANHOU o '+m.championship:' — defendeu o '+m.championship):' — luta valendo o '+m.championship):'';return `${m.ev}: ${r==='w'?'VENCEU':r==='l'?'PERDEU':'EMPATOU'} contra ${opp(m,n).join(' e ')||'?'}${tt}`});
  if(rec.length)l.push('  últimas lutas: '+rec.join(' | '));
  if(p.sw>=2)l.push('  sequência: '+p.sw+' vitórias seguidas');
  const st=S.stories.filter(s=>(s.names||[]).includes(n)).slice(-4).map(s=>`(${s.type}) ${s.text}`);
  if(st.length)l.push('  storylines: '+st.join(' | '));
  const nt=(S.notes||{})[n];
  if(nt&&(nt.cur||nt.plan))l.push('  notas do usuário (SUGESTÃO, não fato): '+[nt.cur,nt.plan].filter(Boolean).join(' / '));
  return l.join('\n');
 }catch(e){return n+' — LUTADOR DA PLW'}
}
/* ---- BRAND DOS TÍTULOS: contexto para Bookers/Jornalistas ---- */
const BK_CROSS=/crossover|cross[- ]?brand|inter[- ]?brand|invas[aã]o|(?:outra|nova) brand|(?:sa[ií]ndo|sair|vindo|vir|mudar|mudando|trocar|trocando|migrar|migrando|passar|passando)\s+(?:d[aeo]s?|para|pra|pro)?\s*(?:a |o )?(?:plw ?ar|plw motion|motion|plw show ?off|show ?off)/i;
function bkBrandLbl(n){const k=bk((S.roster[n]||{}).brand);return k==='PLWAR'?'PLWAR':k==='MOTION'?'PLW MOTION':k==='SHOW OFF'?'PLW SHOW OFF':'PLW'}
function bkTitleBrand(t){return t[1]==='PLWAR'?'PLWAR':t[1]==='MOTION'?'PLW MOTION':t[1]==='SHOW OFF'?'PLW SHOW OFF':'PLW'}

async function callAI(eng,p,imgs,json){
if(!K[eng]){const alt=eng==='gemini'?'openai':'gemini';if(K[alt])eng=alt;else throw{message:'Configure uma API Key na aba Sistema.'}}

if(eng==='gemini'){
const body={contents:[{parts:[{text:p},...ims.map(i=>({inline_data:{mime_type:i.t,data:i.d}}))]}]};
if(json)body.generationConfig={responseMimeType:'application/json'};

const d=await r.json();if(d.error)throw{message:d.error.message};

if(eng==='groq'){const gb={model:K.mgq||GROQ_DEFAULT_MODEL,messages:[{role:'user',content:p}]};if(json)gb.response_format={type:'json_object'};const gr=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+K.groq},body:JSON.stringify(gb)});const gd=await gr.json();if(gd.error)throw{message:gd.error.message};return gd.choices[0].message.content}
const body={model:K.mo,messages:[{role:'user',content:[{type:'text',text:p},...ims.map(i=>({type:'image_url',image_url:{url:'data:'+i.t+';base64,'+i.d}}))]}]};
if(json)body.response_format={type:'json_object'};
const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+K.openai},body:JSON.stringify(body)});
const d=await r.json();if(d.error)throw{message:d.error.message};
return d.choices[0].message.content}

function cleanAIResponse(text){
 let value=String(text??'').trim();
 if(!value)return '';
 const lower=value.toLowerCase();
 const close=lower.lastIndexOf('</think>');
 if(close>=0)return value.slice(close+8).trim();
 const open=lower.indexOf('<think');
 if(open>=0){
  const gt=value.indexOf('>',open);
  if(gt>=0){
   const tail=value.slice(gt+1).trim();
  if(!tail||lower.indexOf('</think>',open)<0)return '';
   return tail.replace(/<\/?think\b[^>]*>/gi,'').trim();
  }
 }
 return value.replace(/<\/?think\b[^>]*>/gi,'').trim();
}
function extractFinalAIResponse(text){
 const cleaned=cleanAIResponse(text);
 if(!cleaned)return '';
 if(cleaned!==String(text??'').trim())return cleaned;
 const lines=cleaned.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
 if(lines.length<2)return '';
 const portugueseWords=new Set('a ao aos aquela aquelas aquele aqueles aquilo as até com como da das de dela delas dele deles depois do dos e ela elas ele eles em entre era essa essas esse esses esta estas este estes eu foi foram há isso isto já mais mas me minha minhas mesmo meu meus na nas nem no nos nossa nossas nosso nossos não o os ou para pela pelas pelo pelos por porque quando que quem se sem ser seu seus sua suas também te tem ter um uma umas uns você vocês'.split(' '));
 const answerTerms=new Set('acho caminho começaria construir deveria deveriam deve devem faria ficam fica funciona ideia manter melhor pode podem precisa recomendo seria são sugiro vale é'.split(' '));
 const isPortugueseAnswerLine=line=>{
  const words=line.toLowerCase().match(/[a-záàâãéêíóôõúüç]+/g)||[];
  return words.filter(word=>portugueseWords.has(word)).length>=2&&words.some(word=>answerTerms.has(word));
 };
 let start=lines.length;
 while(start>0&&isPortugueseAnswerLine(lines[start-1]))start--;
 if(start===0||start===lines.length)return '';
 return lines.slice(start).join('\n');
}
async function callOllama(p,json,onText,system,maxTok){
 const base='http://127.0.0.1:58307';
 const endpoint=base+'/v1/chat/completions';
 const baseSystem=system||'Responda em português do Brasil, de forma direta. Não exponha raciocínio interno. Entregue somente a resposta final ao usuário.';
 const msgs=[{role:'system',content:baseSystem},{role:'user',content:p}];
 const requestBody=(messages)=>({
  model:K.mq||'hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M',
  messages:messages,
  temperature:0.5,
  max_tokens:Math.max(1,Math.min(Number(maxTok)||120,300)),
  stream:false
 });
 const send=async(body)=>{
  console.log('========== PLW AI REQUEST ==========');
  console.log(JSON.stringify(body,null,2));
  console.log('====================================');
  const fetchStarted=performance.now();
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),90000);
  let response;
  try{
   console.log('[OLLAMA] antes do fetch');
   response=await fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),
    signal:controller.signal
   });
   console.log('[OLLAMA] fetch retornou');
   console.log('[OLLAMA] status HTTP:',response.status,'tempo:',Math.round(performance.now()-fetchStarted)+'ms');
   if(!response.ok){
    const errorText=await response.text().catch(()=>'(não foi possível ler o corpo da resposta)');
    throw{message:'API local HTTP '+response.status+': '+errorText};
   }
   let payload;
   try{payload=await response.json()}catch(e){throw{message:'A API local retornou uma resposta JSON inválida (HTTP '+response.status+').'}}
   console.log('[OLLAMA] JSON recebido','tempo:',Math.round(performance.now()-fetchStarted)+'ms');
   if(payload.error)throw{message:'API local '+response.status+': '+(payload.error?.message||payload.error||'sem detalhe')};
   return payload;
  }catch(e){
   if(e?.name==='AbortError')throw{message:'A chamada ao llama-server excedeu o tempo limite de 30 segundos.'};
   if(e?.message)throw e;
   throw{message:'Não consegui conectar ao servidor local em '+base+'. Confira se o llama-server está aberto e se a origem local está permitida.'};
  }finally{clearTimeout(timer)}
 };
 let data=await send(requestBody(msgs));
 const content=String(data?.choices?.[0]?.message?.content||'').trim();
 if(!content)throw new Error('O llama-server retornou uma resposta vazia.');
 const answer=cleanAIResponse(content);
 console.log('[OLLAMA] resposta final','tempo concluído');
 if(onText)onText({text:answer});
 return answer;
}

/* ===== IA dos Bookers/Jornalistas (chamada dedicada) =====
   Qwen3 4B Thinking gasta os tokens em reasoning_content e deixa content vazio.
   Solução: /completion com o bloco <think></think> já FECHADO no prompt (ChatML), então o modelo

function bookerSystem(key){
 return (PERS[key]||PERS.jj)+`\n\n# REGRAS GERAIS E ABSOLUTAS DA PLW\nA PLW é uma liga de wrestling profissional fictícia administrada dentro de um save.\nTodo nome próprio pertencente ao ROSTER PLW deve ser interpretado como um lutador/wrestler da PLW. Não interprete nomes do roster como empresas, cidades, hotéis, serviços, produtos, locais ou organizações externas.\nOs DADOS PLW fornecidos pelo usuário são a fonte de verdade do save.\n\n## FACT E SUGGESTION\nFACT = algo que está explicitamente registrado nos DADOS PLW. SUGGESTION = algo que você está propondo para o futuro. Nunca transforme uma SUGGESTION em FACT. Separe registro de proposta internamente, mas nunca escreva as etiquetas FACT ou SUGGESTION na resposta; fale como um booker, sem linguagem de banco de dados ("não há registro", "segundo os dados", "com base nos dados").\n\n## NÃO INVENTE HISTÓRIA\nNunca invente lutas, resultados, vitórias, derrotas, rivalidades, revanches, promos, ataques, segmentos, alianças, traições, humilhações, confrontos anteriores, confrontos futuros como se já estivessem marcados, motivos pessoais, acontecimentos de bastidores ou relações entre lutadores. Não diga que dois lutadores já se enfrentaram só porque isso seria uma rivalidade lógica. Não diga que uma luta é revanche se o histórico fornecido não mostrar o confronto anterior. Não diga que alguém venceu recentemente sem esse resultado nos dados. Se os dados não mostrarem direção, diga isso como interpretação, não como fato.\n\n## NÃO FAÇA INFERÊNCIAS FACTUAIS\nNão deduza que A enfrentou C porque A venceu B e B venceu C; que dois campeões têm uma storyline; que alguém busca revanche após perder um título; ou que uma luta registrada significa que há rivalidade. Somente dados explicitamente registrados estabelecem esses fatos. Use-os para criar sugestões futuras, sempre identificadas como sugestões.\n\n## CONTINUIDADE TEMPORAL\nRespeite a ordem dos eventos. Os resultados mais recentes representam o estado atual. Se um título mudou de mãos, considere o novo campeão. Se uma rivalidade ou storyline foi encerrada, não a trate automaticamente como ativa. Não ressuscite acontecimentos antigos sem motivo, misture eventos ou atribua a um PPV uma luta de outro evento.\n\n## DADOS AUSENTES\nSe uma informação necessária não estiver nos dados, não invente. Diga, por exemplo: Isso não consta nos dados que tenho; Não tenho esse histórico registrado no brief; Os dados não informam se eles já se enfrentaram. Se for útil, depois faça uma sugestão baseada no que está disponível.\n\n## ANÁLISE DE BOOKING\nNão escreva apenas elogios genéricos. Considere momentum, direção dos lutadores, força dos títulos, rivalidades que continuam ou terminaram, consequências, problemas futuros e como o próximo PPV pode aproveitar os resultados. Diferencie FATO, INTERPRETAÇÃO e SUGESTÃO. Exemplo: X derrotou Y é fato; isso pode ter fortalecido X é interpretação; eu usaria essa vitória para iniciar uma rivalidade com Z é sugestão. Não transforme interpretação em fato.\n\n## SUGESTÕES DE BOOKING\nAo sugerir challengers ou rivalidades, considere resultados recentes, vitórias e derrotas, campeões, títulos, hype, rivalidades, storylines e histórico registrado. Não escolha automaticamente o lutador mais famoso. Não crie rivalidade baseada em histórico inexistente. Quando houver várias opções plausíveis, apresente alternativas e explique brevemente o que cada uma permite.\n\n## PPVS E EXPECTATIVAS\nAnalise PPVs pelos resultados fornecidos, mudanças de título, continuidade, momentum e consequências para o próximo evento; não invente segmentos. Ao falar do futuro, trate-o como possibilidade, não como acontecimento planejado. Prefira: Eu procuraria um novo desafiante para Moxley, porque o Beast Mode terminou com ele mantendo o título. Não diga que Moxley enfrentará alguém sem registro explícito.\n\n## ESTILO E TAMANHO\nPortuguês brasileiro, informal, natural e direto; não pareça um relatório corporativo nem repita o brief desnecessariamente. Pergunta simples pede resposta simples. Normalmente, responda em até 5 frases; ultrapasse esse limite quando pedirem card, plano, storyline ou análise detalhada. Comece diretamente pela resposta.\n\n## RACIOCÍNIO INTERNO\nNunca mostre raciocínio interno, pensamentos em inglês nem tags <think>. Nunca explique passo a passo como chegou à resposta.\n\n## REGRA FINAL\nPriorize: 1. fidelidade aos DADOS PLW; 2. continuidade do save; 3. responder exatamente ao que foi perguntado; 4. análise inteligente; 5. criatividade para sugestões futuras. Se criatividade e factualidade entrarem em conflito, escolha factualidade. É melhor dizer que algo não consta nos dados do que inventar uma história plausível.`;

async function streamCompletion(base,prompt,mt,onText,onStatus,TAG){
 const ctl=new AbortController(),t0=performance.now();
 let first=false,acc='',cut=false;
 const st=x=>{if(onStatus)onStatus(x)};
 const ft=setTimeout(()=>{if(!first)ctl.abort()},180000);
 const tick=setInterval(()=>{if(!first)st('processando ('+Math.round((performance.now()-t0)/1000)+'s)')},1000);

 try{
  st('enviando '+prompt.length+' caracteres');

  const r=await fetch(base+'/completion',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    prompt,
    n_predict:mt,
    temperature:0.4,
    stop:['<|im_end|>','<|im_start|>'],
    stream:true,
    cache_prompt:true
   }),
   signal:ctl.signal
  });

  if(!r.ok){
   throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,500));
  }

  const rd=r.body.getReader();
  const dec=new TextDecoder();
  let buf='';

  for(;;){
   const {done,value}=await rd.read();
   if(done)break;

   buf+=dec.decode(value,{stream:true});

   let i;
   while((i=buf.indexOf('\n'))>=0){
    const line=buf.slice(0,i).trim();
    buf=buf.slice(i+1);

    if(!line)continue;

    let o;
    try{
     if(line.startsWith('data:')){
      const data=line.slice(5).trim();
      if(!data||data==='[DONE]')continue;
      o=JSON.parse(data);
     }else{
      o=JSON.parse(line);
     }
    }catch(e){
     continue;
    }

    console.log(TAG,'chunk:',JSON.stringify(o));

    const content=
     o.content ??
     o.token ??
     o.response ??
     o.choices?.[0]?.text ??
     o.choices?.[0]?.delta?.content ??
     '';

    if(content){
     if(!first){
      first=true;
      clearTimeout(ft);
      clearInterval(tick);
      console.log(TAG,'primeiro token em',Math.round(performance.now()-t0)+'ms');
     }

     acc+=content;

     const c=cleanAIResponse(acc);
     if(c&&onText)onText({text:c});
    }

    if(o.stop||o.stopped_limit||o.stopped_word)cut=true;

    if(o.timings){
     console.log(TAG,'timings',JSON.stringify(o.timings));
    }
   }
  }

  window.__olCut=cut;
  console.log(TAG,'RESPOSTA FINAL:',acc);
  return acc;

 }catch(e){
  if(acc.trim())return acc;

  if(e&&e.name==='AbortError'){
   throw new Error('o servidor não devolveu nenhum token em 180s.');
  }

  throw e;

 }finally{
  clearTimeout(ft);
  clearInterval(tick);
 }
}

const BK_RULES=`\n\n# MODO BOOKING (PRIORIDADE MÁXIMA)\nCANON = já aconteceu e está nos DADOS PLW. CURRENT = situação atual registrada (campeões, roster, lesões, moral). BOOKING = proposta para o futuro. Nunca misture.\nQuando o usuário falar de próximo PPV/show, "quero fazer", "vamos colocar", "e se", "pensei em", "quem enfrenta", "qual desafiante", "quem ganha", "como terminar a rivalidade", ou listar lutas ("A x B, A ganha"), ele é o BOOKER e está PROPONDO. Lutas, nomes, estipulações e vencedores citados são PROPOSTAS, não fatos a verificar. Esta seção prevalece sobre DADOS AUSENTES e NÃO FAÇA INFERÊNCIAS para propostas futuras.\n- PROIBIDO dizer "não há registro", "não consta nos dados" ou "não posso afirmar" sobre algo futuro. Aceite e trabalhe a ideia.\n- Seja parceiro criativo, não "sim senhor": analise cada luta (momentum, quem perdeu ou ganhou recentemente, World Shot/títulos, se já lutaram segundo os dados), concorde ou discorde com motivo, proponha ajuste de resultado ou finalização e o que isso cria para o próximo ciclo.\n- Se perguntarem "X contra quem?", sugira 1 a 3 candidatos olhando roster, brand, campeões, resultados recentes e rivalidades, cada um com motivo curto. Responda direto; só faça uma pergunta curta se faltar algo essencial.\n- Histórico é ferramenta: já lutaram = possível revanche; nunca lutaram = luta inédita; derrota recente, sequência de vitórias, novo campeão e rivalidade em alta pesam no booking. Análise nunca vira fato novo.\n- Confira nos dados só CANON e CURRENT (campeão atual, brand, resultados passados, lesionado ou suspenso). Avise se um lutador citado estiver lesionado, suspenso ou em outra brand.\n- NÃO INVENTE HISTÓRIA: nunca diga que algo passado aconteceu (ataque, traição, lutas anteriores, promo) sem estar nos dados. Pode propor: "podemos fazer X atacar Y no show".\n- Resultado futuro é decisão do usuário: "Moxley ganha" é escolha de booking. Aceite e comente.\n- Marque propostas como BOOKING quando ajudar, sem repetir em toda frase. Português do Brasil, direto.\n\n# BRAND DOS CAMPEONATOS (DADO DO SAVE, NÃO É SUGESTÃO)\nCada campeonato pertence a uma BRAND: PLW World Championship e PLW World Tag Team Championship = PLW (globais); PLWAR Crown e PLWAR Ace = PLWAR; PLW Motion Next Level e PLW Motion Rising = PLW MOTION; PLW Show Off Championship = PLW SHOW OFF. Todo lutador do roster é da PLW, mas cada um tem uma brand atual: estar na PLW não o torna elegível para todos os títulos.\nAo sugerir challengers para um campeonato, respeite a brand atual do campeonato e do wrestler. Um wrestler só deve ser sugerido normalmente para um título se estiver na mesma brand. Cross-brand só acontece quando o usuário pedir explicitamente ou quando os dados registrados indicarem esse crossover.\n- Use o ROSTER POR BRAND e a lista CANDIDATOS ELEGÍVEIS dos DADOS PLW. Lutador de outra brand não é challenger normal (ex.: quem é da PLWAR não desafia título da PLW MOTION por padrão). Para os títulos globais, qualquer brand pode ser sugerida.\n- Se o usuário perguntar apenas "quem desafia X?", respeite a brand do título. Se ele pedir explicitamente crossover, invasão, interbrand ou troca de brand, aí pode usar outra brand, dizendo de qual brand o lutador vem.\n\n# HIERARQUIA DAS BRANDS (REGRA DO UNIVERSO)\nPLWAR = TIER S, a brand mais importante e prestigiada (main events e títulos de maior peso). Em segundo vem PLW MOTION. Em terceiro vem PLW SHOW OFF. World Championship e World Tag Team Championship são títulos GLOBAIS (de todas as brands); os demais pertencem à sua brand (PLWAR: Crown e Ace; MOTION: Next Level e Rising; SHOW OFF: Show Off Championship). Use a hierarquia ao sugerir subida de brand, importância de cada luta e peso de cada título. Não invente outras regras de hierarquia.`;

function cleanN(s){return String(s||'').replace(/^[\s*_\-\[\]().]+|[\s*_\-\[\]().]+$/g,'').trim()}
function parseCardLines(t){const res=[];String(t||'').split(/\n/).forEach(l=>{const m=l.match(/LUTA\s*:\s*(.+)/i);if(!m)return;const f=m[1].split('|').map(s=>s.trim());const a=(f[0]||'').split(/\s+(?:x|vs\.?|versus)\s+/i).map(cleanN).filter(Boolean);if(a.length<2)return;const st=/^(normal|-|luta normal|—)?$/i.test(f[1]||'')?'':f[1];const t=t2(f[2]||'');const wn=nz(f[3]||'');const w=a.find(x=>wn&&(nz(x)===wn||wn.includes(nz(x))))||'';res.push({a:a.slice(0,6),st,t,w,why:f.slice(4).join(' | ')})});return res.slice(0,8)}

function nkey(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9&]+/g,' ').replace(/\s+/g,' ').trim()}
function wOut(n){const w=S.roster[n]||{};return !!(w.inj||w.susp||w.status==='suspenso')}
function tagTeamsMap(){const o={};Object.entries(groups('tag')).forEach(([k,a])=>{const nm=((a[0]||{}).names||[]).filter(Boolean);if(nm.length>=2)o[k]=nm});return o}
function champSet(ti){const c=String(((S.titles[TITLES[ti][0]])||{}).champ||'').trim(),s=new Set();if(!c)return s;s.add(nkey(c));c.split(/\s*&\s*/).forEach(x=>{if(x.trim())s.add(nkey(x))});Object.entries(tagTeamsMap()).forEach(([k,nm])=>{if(nkey(k)===nkey(c))nm.forEach(x=>s.add(nkey(x)))});return s}
function contPool(ti){const t=TITLES[ti],cs=champSet(ti);
 if(ti===1)return Object.entries(tagTeamsMap()).filter(([k,nm])=>nm.every(x=>S.roster[x]&&!wOut(x))&&!cs.has(nkey(k))&&!nm.some(x=>cs.has(nkey(x)))).map(([k])=>k);
 return Object.keys(S.roster).filter(n=>{if(wOut(n)||cs.has(nkey(n)))return false;return t[1]==='GLOBAL'||bk((S.roster[n]||{}).brand)===t[1]})}
function contMatch(pool,raw){const k=nkey(raw);if(!k)return'';const ex=pool.find(p=>nkey(p)===k);if(ex)return ex;if(k.length<4)return'';const h=pool.filter(p=>nkey(p).startsWith(k+' '));return h.length===1?h[0]:''}
function contOk(ti,x){const k=nkey(x);return contPool(ti).some(p=>nkey(p)===k)}
async function ppvAiCont(){if(busy)return;const n=CURP,P=ppvPlan(n);busy=true;P.aiC='⏳ pensando disputantes...';redrawPpv(n);

if(!lines){P.aiC='Sem lutadores elegíveis no roster para sugerir. Importe o roster ou revise brands e lesões.';busy=false;persist();redrawPpv(n);return}
const p=BK_PRE+'=== DADOS PLW ===\n'+shortDigest('título campeão desafiante rivalidade '+n)+'\n\n=== PPV ===\n'+n+'\n=== JÁ MONTADO (BOOKING) ===\n'+(ppvSummary(n)||'(nada)')+'\n\n=== ELEGÍVEIS POR TÍTULO (LISTA FECHADA) ===\n'+lines+'\n\nTAREFA: para CADA título acima, escolha 2 ou 3 disputantes SOMENTE da lista ELEGÍVEIS daquele título, copiando o nome EXATAMENTE como está escrito. PROIBIDO citar nome fora da lista (não invente lutadores, duplas ou nomes de outras promoções). O campeão nunca disputa contra ele mesmo. Considere momentum, vitórias e derrotas recentes e rivalidades.\nResponda SOMENTE com linhas neste formato, sem texto extra:\nDISPUTA: nome do título | nome1, nome2, nome3 | motivo curto';
let out='';try{out=await aiRun(p,900,x=>{if(/^⏳/.test(P.aiC||''))P.aiC='⏳ '+x})}catch(e){P.aiC='Erro: '+(e.message||e.code)}
if(!/^Erro/.test(P.aiC||'')){const cs={};let got=0;String(out||'').split(/\n/).forEach(l=>{const m=l.match(/DISPUTA\s*:\s*(.+)/i);if(!m)return;const f=m[1].split('|').map(s=>s.trim());const t=t2(f[0]||'');if(!t)return;const ti=TITLES.findIndex(x=>x[0]===t);if(ti<0)return;got++;const ns=[];(f[1]||'').split(',').map(cleanN).filter(Boolean).forEach(x=>{const v=contMatch(pools[ti],x);if(v&&!ns.includes(v))ns.push(v)});if(ns.length)cs[t]={n:ns.slice(0,3),why:f.slice(2).join(' | ')}});
 if(got){TITLES.forEach((t,ti)=>{if(cs[t[0]]||!pools[ti].length)return;const top=pools[ti].slice().sort((a,b)=>{const x=S.roster[a]||{},y=S.roster[b]||{};return((y.w||0)-(y.l||0))-((x.w||0)-(x.l||0))||(y.w||0)-(x.w||0)}).slice(0,3);cs[t[0]]={n:top,why:'automático: melhor campanha entre os elegíveis'}});P.csug=cs;P.aiC=''}else P.aiC=out?'A IA não respondeu no formato esperado. Resposta dela:\n'+out:'Sem resposta da IA.'}
busy=false;persist();redrawPpv(n)}

function tourGet(){const P=ppvP();return P.tour=P.tour||{name:'',prize:'',pw:2,pd:1,blocks:[{n:'Bloco A',p:[]},{n:'Bloco B',p:[]}],res:{},fin:{a:'',b:'',w:''}}}
function tPairs(b){const o=[];for(let i=0;i<b.p.length;i++)for(let j=i+1;j<b.p.length;j++)o.push([b.p[i],b.p[j]]);return o}
function tTable(T,bi){const b=T.blocks[bi],R={};b.p.forEach(n=>R[n]={n,j:0,v:0,e:0,d:0,pt:0});const pw=+T.pw||0,pd=+T.pd||0;tPairs(b).forEach(([x,y])=>{const r=T.res[bi+'|'+x+'|'+y];if(!r)return;R[x].j++;R[y].j++;if(r==='d'){R[x].e++;R[y].e++;R[x].pt+=pd;R[y].pt+=pd}else{const w=r==='x'?x:y,l=r==='x'?y:x;R[w].v++;R[l].d++;R[w].pt+=pw}});return Object.values(R).sort((a,b)=>b.pt-a.pt||b.v-a.v)}
function tourHtml(P){const T=tourGet();
const head=`<div class="mut">Plano de torneio em blocos (estilo G1): todos contra todos, vitória e empate valem pontos, os líderes vão à final. É BOOKING, não entra no histórico. Formato genérico: ajuste conforme o torneio está configurado no Journey.</div><label class="mut">Nome do torneio</label><input value="${esc(T.name)}" placeholder="Ex.: August Madness" onchange="tourSet('name',this.value)"><label class="mut">Prêmio do vencedor</label><input value="${esc(T.prize)}" placeholder="Ex.: World Shot" onchange="tourSet('prize',this.value)"><div class="row"><div><label class="mut">Pontos por vitória</label><input type="number" value="${+T.pw||0}" onchange="tourSet('pw',+this.value)"></div><div><label class="mut">Pontos por empate</label><input type="number" value="${+T.pd||0}" onchange="tourSet('pd',+this.value)"></div></div>`;
const blocks=T.blocks.map((b,bi)=>{const tb=tTable(T,bi),pairs=tPairs(b);return`<div class="card" style="--c:#d4a017"><div class="row" style="align-items:center"><input value="${esc(b.n)}" onchange="tourBlk(${bi},'n',this.value)"><button class="btn r pcb" style="flex:0 0 auto" onclick="tourDelBlk(${bi})">🗑 bloco</button></div><div style="margin:6px 0">${b.p.map((x,k)=>`<span class="tag" style="--c:#6A0DAD">${esc(x)} <b style="cursor:pointer" onclick="tourDelP(${bi},${k})">✕</b></span>`).join(' ')||'<span class="mut">Sem participantes.</span>'}</div><input list="pcl" placeholder="+ participante" onchange="tourAddP(${bi},this.value)">${tb.length>1?`<table class="tt"><tr><th>#</th><th>Lutador</th><th>J</th><th>V</th><th>E</th><th>D</th><th>Pts</th></tr>${tb.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.j}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td><b>${r.pt}</b></td></tr>`).join('')}</table>`:''}${pairs.length?`<div class="sec" style="font-size:16px">JOGOS (${pairs.length})</div>${pgList('tm-'+bi,pairs,8,([x,y])=>{const r=T.res[bi+'|'+x+'|'+y]||'';return`<div class="row" style="align-items:center;margin-bottom:4px"><span style="flex:1.2">${esc(x)} <span class="mut">x</span> ${esc(y)}</span><select style="flex:1" data-b="${bi}" data-x="${esc(x)}" data-y="${esc(y)}" onchange="tourRes(this)"><option value="">a definir</option><option value="x" ${r==='x'?'selected':''}>${esc(x)} vence</option><option value="y" ${r==='y'?'selected':''}>${esc(y)} vence</option><option value="d" ${r==='d'?'selected':''}>Empate</option></select></div>`})}`:''}</div>`}).join('');
const F=T.fin;const fin=`<div class="card" style="--c:#FF6B00"><b>🏆 FINAL</b><div class="row"><input list="pcl" value="${esc(F.a)}" placeholder="Finalista 1" onchange="tourFin('a',this.value)"><input list="pcl" value="${esc(F.b)}" placeholder="Finalista 2" onchange="tourFin('b',this.value)"></div><button class="btn s" style="margin:6px 0" onclick="tourLead()">Usar os líderes dos 2 primeiros blocos</button><select onchange="tourFin('w',this.value)"><option value="">Campeão do torneio: a definir</option>${[F.a,F.b].filter(Boolean).map(x=>`<option value="${esc(x)}" ${F.w===x?'selected':''}>${esc(x)} vence</option>`).join('')}</select>${F.w&&T.prize?`<div class="mut">🎁 ${esc(F.w)} leva: ${esc(T.prize)} (booking)</div>`:''}</div>`;
return head+`<div class="sec" style="font-size:18px">BLOCOS</div>`+blocks+`<button class="btn s" style="width:100%;margin-bottom:8px" onclick="tourAddBlk()">+ Novo bloco</button>`+fin}
function tourSet(k,v){const T=tourGet();T[k]=v;persist();if(k==='pw'||k==='pd')redrawPpv(CURP)}
function tourBlk(bi,f,v){tourGet().blocks[bi][f]=v;persist()}
function tourAddBlk(){const T=tourGet();if(T.blocks.length>=8)return;T.blocks.push({n:'Bloco '+String.fromCharCode(65+T.blocks.length),p:[]});persist();redrawPpv(CURP)}
function tourDelBlk(bi){if(!confirm('Excluir este bloco?'))return;const T=tourGet();T.blocks.splice(bi,1);const R={};Object.entries(T.res).forEach(([k,v])=>{const s=k.split('|'),b=+s[0];if(b===bi)return;s[0]=b>bi?b-1:b;R[s.join('|')]=v});T.res=R;persist();redrawPpv(CURP)}
function tourAddP(bi,v){v=String(v||'').trim();const b=tourGet().blocks[bi];if(!v||b.p.includes(v))return;b.p.push(v);persist();redrawPpv(CURP)}
function tourDelP(bi,k){const T=tourGet(),b=T.blocks[bi],nm2=b.p[k];b.p.splice(k,1);Object.keys(T.res).forEach(key=>{const s=key.split('|');if(+s[0]===bi&&(s[1]===nm2||s[2]===nm2))delete T.res[key]});persist();redrawPpv(CURP)}
function tourRes(el){const T=tourGet(),k=el.dataset.b+'|'+el.dataset.x+'|'+el.dataset.y;if(el.value)T.res[k]=el.value;else delete T.res[k];persist();redrawPpv(CURP)}
function tourFin(k,v){const F=tourGet().fin;F[k]=String(v||'').trim();if(k!=='w'&&F.w!==F.a&&F.w!==F.b)F.w='';persist();redrawPpv(CURP)}
function tourLead(){const T=tourGet(),l=[0,1].map(i=>T.blocks[i]?tTable(T,i)[0]:null);if(!l[0]||!l[1]||!l[0].j||!l[1].j)return toast('Preencha alguns resultados nos dois primeiros blocos.');T.fin.a=l[0].n;T.fin.b=l[1].n;T.fin.w='';persist();redrawPpv(CURP)}

/* ---- Conversas: encerrar = congelar (apagar ou retomar só se você quiser) ---- */
const chatConv={};
function upsertConv(key,closed){const h=(chats[key]||[]).filter(x=>x.t&&!/^Erro:/.test(x.t));if(!h.length)return false;S.convs=S.convs||[];const msgs=h.map(x=>({r:x.r,t:x.t})),now=new Date().toLocaleString('pt-BR');let c=S.convs.find(x=>x.id===chatConv[key]);if(c){c.msgs=msgs;c.closed=closed;c.date=now}else{const first=h.find(x=>x.r==='u');c={id:Date.now(),key,title:(first?first.t:'Conversa').slice(0,60),date:now,msgs,closed};S.convs.unshift(c);chatConv[key]=c.id}persist();return true}
saveConv=function(key){if(upsertConv(key,false)){toast('💾 Conversa salva.');if(tab===key)render()}else toast('Nada para salvar ainda.')};

# REGRAS DA PLW (absolutas)
A PLW é uma liga fictícia dentro de um save. Nomes do ROSTER são lutadores (nunca empresas, cidades ou produtos); eventos e cinturões não são lutadores; MJF = Maxwell Jacob Friedman (uma pessoa). Os dados do contexto são a única fonte de fatos.

- Não invente passado: lutas, resultados, rivalidades, revanches, promos, ataques, alianças, motivos ou bastidores; não deduza confronto anterior por lógica. Sem dado sobre o passado, diga que não tem essa informação. Sobre o futuro, quem propõe é o head booker: aceite a ideia e trabalhe, sem exigir registro.
- Continuidade: o resultado mais recente é o estado atual (campeão, brand). Rivalidade encerrada não é ativa. Vitória e cash-in são eventos distintos; não misture eventos nem altere vencedores.
- Brands e títulos: PLW World Championship e PLW World Tag Team Championship são GLOBAIS (qualquer brand); PLWAR Crown e Ace = PLWAR; PLW Motion Next Level e Rising = PLW MOTION; PLW Show Off Championship = PLW SHOW OFF. Challenger de título só da mesma brand do título; crossover só se o head booker pedir (invasão, troca de brand, interbrand) ou se o dado registrado indicar, dizendo de qual brand o lutador vem. O campeão nunca desafia a si mesmo.
- Hierarquia: PLWAR = tier S (mais prestigiada), depois PLW MOTION, depois PLW SHOW OFF. Use ao pesar subida de brand e peso de luta e título. Não invente outras regras.
- Luta, vencedor ou card futuro citado pelo head booker é decisão de booking: comente e discorde com motivo. Avise só se o lutador estiver lesionado, suspenso ou em outra brand.
- Autoridade: decisão explícita dele é direção final (execute, não reabra); rejeição não volta, nem reformulada; correção de brand vale na hora. Use só nomes da lista de candidatos/roster atual. Evento futuro em planejamento não precisa existir no histórico.
- Nunca mostre raciocínio interno, pensamentos em inglês nem tags <think>. Português do Brasil.`;

# HUMANIDADE — REGRA PRIORITÁRIA (vale mais que qualquer regra de estilo)
Você conversa como pessoa numa reunião criativa de wrestling, não como gerador de resumos ou planos. Pergunte-se: "Sentado ao lado do booker, o que eu responderia agora?" Essa é a resposta.
1. Responda ao que o USUÁRIO acabou de dizer, e só a isso. Se perguntou de Moxley, fale de adversários do Moxley. Se disse "não gostei de Page", reavalie e traga alternativas. Se sugeriu Naito, reaja: "Naito pode funcionar por X, mas eu teria cuidado com Y", sem virar booking de 10 segmentos.

    (state && Number(state.openSlots)>0 && /\b(vaga|vagas|slot|slots|preench|preencher|preenchemos|preencheremos|quem entra|quem colocar|quem escolhe|sobre as vagas|sobre a vaga|nomes? do|da motion|do motion|da show off|do show off|motion e show off|motion e showoff|show off e motion)\b/.test(f)) ||
    (state && (state.openSlotPools||[]).length && /\b(motion|show off|showoff|plw motion|plw show off)\b/.test(f))) return INTENTS.ROSTER_SELECTION;
 if(/\b(qual|quem)\b.*\bfoi\b|\bperdeu\b.*\b(para|contra)\b|\bganhou\b.*\b(para|contra)\b|\bvenceu\b.*\b(para|contra)\b|\bquem\b.*\bvenceu\b|\bquem\b.*\bganhou\b|\baconteceu\b|\bno save\b|\bno canon\b|\bera\b.*\bno passado\b/.test(f) && !/\bideia|ideias\b/.test(f)) return INTENTS.CANON_QUERY;
 if(/\b(save|salva|salvar|anota|anotar|fechado|fica decidido|ficou decidido|vai ser|quero que|quero\b.*\bvença|quero\b.*\bganhe|confirmo|confirmado)\b/.test(f) &&
    (n.length||/\b(vai|sera|será|fica|fechado|decidido)\b/.test(f)) &&
    !(/\b(com quem|preenchemos|preencher|vagas?|slots?)\b/.test(f) && /\b(motion|show off|showoff|plw motion|plw show off|pool|restantes?)\b/.test(f)) &&
    !/\b(nao quero|não quero)\b.*\b(campe(?:a|ã)o|titulo|título|champion)\b/.test(f)) return INTENTS.BOOKING_DECISION;
 if(/\b(rivalidade|arco|storyline|historia|história|construir|desenvolver)\b/.test(f)) return INTENTS.STORY_BUILD;
 if(/\b(ideia|ideias|sugestao|sugestões|sugestao|o que acham|o que voces acham|que tal|como fariam)\b/.test(f)) return INTENTS.BOOKING_IDEA;
 return INTENTS.GENERAL_BOOKING;
}

function topicKey(q,intent){
 const ns=mentionNames(q).map(fold).sort();
 const ts=titleHits(q).map(fold).sort();
 const es=eventHits(q).map(fold).sort();
 const words=fold(q).split(' ').filter(x=>x.length>3 && !/^(agora|vamos|falar|sobre|ideia|ideias|nome|nomes|quem|qual|para|duas|vagas|deve|deveria|quero|me|da|do|um|uma|e|o|a)$/.test(x)).slice(0,6);
 return [ns.join(','),ts.join(','),es.join(','),intent==='CONTINUE_CURRENT_BOOKING'?'continue':words.join(',')].join('|');
}
function topicRelated(q,state,intent){
 const f=fold(q);
 if(!state?.topicId) return false;
 if(intent===INTENTS.CONTINUE_CURRENT_BOOKING || intent===INTENTS.CORRECTION) return true;
 const n=mentionNames(q);
 if(n.length && ([...(state.confirmed||[]),...(state.ineligible||[])].some(oldName=>n.some(name=>canon(oldName)===canon(name))))) return true;
 if((state.confirmed||[]).length || (state.ineligible||[]).length){
   if(/\b(ladder|confirmad[oa]s?|ja esta|já está|ja estao|já estão|fora da disputa|inelegivel|inelegível|perdeu a qualificacao|perdeu a qualificação|eliminad[oa]s?)\b/.test(f)) return true;
 }
 // Follow-ups curtos de uma ideia pertencem ao tópico ativo mesmo sem repetir o nome do PPV/luta.
 if([INTENTS.BOOKING_IDEA,INTENTS.GIMMICK_IDEA,INTENTS.STORY_BUILD,INTENTS.NAME_GENERATION,INTENTS.TEAM_NAME].includes(intent) && state?.topicId &&
    (/^(eu digo|eu quis dizer|tipo|quer dizer|qual|como|e qual|e como|mas e|mas qual|nesse caso|entao|então|certo|beleza|isso|sim|nao|não)\b/.test(f) || f.split(/\s+/).length<=8)) return true;
 if(intent===INTENTS.ROSTER_SELECTION && (state.openSlotPools||[]).length && /\b(motion|show off|showoff|plwar|vagas?|slots?)\b/.test(f)) return true;
 if(intent===INTENTS.ROSTER_SELECTION && (Number(state.openSlots)>0 || (state.openSlotPools||[]).length || (state.confirmed||[]).length || /\b(roster|plantel|nomes?|lutadores?|wrestlers?)\b/.test(f))) return true;
 if([INTENTS.WINNER_QUESTION,INTENTS.BOOKING_DECISION].includes(intent) &&
    ((state.confirmed||[]).length || Number(state.openSlots)>0 || (state.subjectTitles||[]).length || (state.subjectEvents||[]).length)) return true;
 const old=new Set((state.subjectNames||[]).map(canon));
 if(n.length && n.some(x=>old.has(canon(x)))) return true;
 const th=titleHits(q),eh=eventHits(q);
 if(th.length && th.some(x=>(state.subjectTitles||[]).includes(x))) return true;
 if(eh.length && eh.some(x=>(state.subjectEvents||[]).includes(x))) return true;
 return !n.length&&!th.length&&!eh.length && /^(e|entao|então|beleza|certo|e ai|e aí|e no|e depois|qual deles|e o que)/.test(f);
}

function ensureState(m){
 if(!m.aiState)m.aiState={};
 const s=m.aiState;
 if(!Array.isArray(s.canonRefs))s.canonRefs=[];
 if(!Array.isArray(s.decisions))s.decisions=[];
 if(!Array.isArray(s.constraints))s.constraints=[];
 if(!Array.isArray(s.confirmed))s.confirmed=[];
 if(!Array.isArray(s.ineligible))s.ineligible=[];
 if(!Array.isArray(s.proposals))s.proposals=[];
 if(!Array.isArray(s.subjectNames))s.subjectNames=[];
 if(!Array.isArray(s.subjectTitles))s.subjectTitles=[];
 if(!Array.isArray(s.subjectEvents))s.subjectEvents=[];
 if(!Array.isArray(s.userMessages))s.userMessages=[];
 if(!Array.isArray(s.decisionHistory))s.decisionHistory=[];
 if(!Array.isArray(s.validationIssues))s.validationIssues=[];
 if(!Array.isArray(s.rejectedCandidates))s.rejectedCandidates=[];
 if(!Array.isArray(s.openSlotPools))s.openSlotPools=[];
 if(typeof s.openSlots!=='number')s.openSlots=0;
 if(typeof s.topicId!=='string')s.topicId='';
 if(typeof s.topic!=='string')s.topic='';
 if(typeof s.mode!=='string')s.mode='';
 if(typeof s.intent!=='string')s.intent='';
 if(typeof s.subject!=='string')s.subject='';
 if(typeof s.question!=='string')s.question='';
 if(typeof s.lastUserMessage!=='string')s.lastUserMessage='';
 return s;
}

function newTopic(s,q,intent){
 s.topicId='topic-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
 s.topic=clean(q).slice(0,180);
 s.mode=intent;
 s.subject=clean(q).slice(0,220);
 s.intent=intent;
 s.question=clean(q);
 s.subjectNames=mentionNames(q);
 s.subjectTitles=titleHits(q);
 s.subjectEvents=eventHits(q);
 s.canonRefs=[]; s.decisions=[]; s.constraints=[]; s.confirmed=[]; s.ineligible=[];
 s.openSlots=0; s.openSlotPools=[]; s.proposals=[]; s.rejectedCandidates=[]; s.validationIssues=[];
}
function samePerson(a,b){return canon(a)===canon(b)}
function addUnique(arr,v){
 const c=canon(v);
 if(c&&!arr.some(x=>samePerson(x,c)))arr.push(v);
}
function parseNumbers(q){
 const raw=clean(q);
 const m=raw.match(/\b(\d+)\s*(?:vagas?|slots?)\b/i);
 if(m)return Math.max(0,parseInt(m[1],10));
 const f=fold(raw), words={uma:1,um:1,duas:2,dois:2,tres:3,três:3,quatro:4,cinco:5,seis:6};
 const w=f.match(/\b(uma|um|duas|dois|tres|três|quatro|cinco|seis)\s+(?:vagas?|slots?)\b/);
 if(w)return words[w[1]];
 // Formato de card usado pelo usuário: X 1 (PLWAR) X 1 (MOTION) ...
 // Cada ocorrência representa uma vaga de um pool/brand.
 if(/\bvagas?\s+(?:restantes|abertas?)\b|\bpreenchemos\s+as\s+vagas\b|\bcom\s+quem\b/.test(f)){
   const slots=(raw.match(/\bx\s*1\s*\([^)]*\)/gi)||[]).length;
   if(slots>0)return slots;
 }
 return null;
}
function explicitCardParticipants(text){
 const raw=clean(text);
 // No formato de card, procure somente nomes que realmente existem no roster
 // antes do primeiro marcador X 1 (POOL). Assim o nome do título nunca vira lutador.
 const head=raw.split(/\bx\s*1\s*\(/i)[0];
 if(!/\b6[- ]?man\b|\btriple threat\b|\bfatal 4[- ]?way\b|\btag\b|\bmatch\b|\bvs\b/i.test(raw))return [];
 return names().filter(n=>new RegExp('(^|\\s)'+String(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s|$)','i').test(head))
   .sort((a,b)=>head.toLowerCase().indexOf(a.toLowerCase())-head.toLowerCase().indexOf(b.toLowerCase()));
}

function applyCardPlacementDecision(m,text){
 const s=ensureState(m), f=fold(text);
 const placement=/\b(coloque|colocar|coloca|entra|entrar|vai\s+(?:pro|para o)|ponha|põe|poe)\b[\s\S]{0,90}\b(card|luta)\b/i.test(text) || /\bno\s+card\b/i.test(text) && /\b(gostei|curti|aprov|escolh|fica|fech|vamos com)\b/i.test(text);
 if(!placement)return false;
 const selected=mentionNames(text).filter(n=>!/\b(restante|resto|outros?|outras?)\b/i.test(n));
 if(!selected.length)return false;
 selected.forEach(n=>{s.ineligible=s.ineligible.filter(x=>!samePerson(x,n));addUnique(s.confirmed,n)});
 if(!Array.isArray(s.openSlotPools))s.openSlotPools=[];
 // Consome exatamente uma vaga compatível com a brand do lutador escolhido.
 for(const n of selected){
   const key=rosterFind(n)||n, brand=fold((S.roster[key]||{}).brand||'');
   let idx=-1;
   if(brand) idx=s.openSlotPools.findIndex(p=>{const w=fold(p);return w===brand||w.includes(brand)||brand.includes(w)});
   if(idx<0&&s.openSlotPools.length)idx=0;
   if(idx>=0)s.openSlotPools.splice(idx,1);
 }
 s.openSlots=Math.max(0,(s.openSlots||0)-selected.length);
 // Espelha a decisão explícita no estado do MINI-CARD sem promover sugestões rejeitadas.
 const cardState=meetingStateEnsure(m);
 if(!Array.isArray(cardState.cardMatches))cardState.cardMatches=[];
 const namesNow=uniq(s.confirmed).map(n=>rosterFind(n)||n);
 if(namesNow.length>=2){
   const key=namesNow.map(canon).sort().join('|');
   let row=cardState.cardMatches.find(x=>x&&x.source==='meeting'&&x.topicId===s.topicId);
   if(!row){row={key,names:[],type:'6man',st:'',title:s.subjectTitles?.[0]||'',source:'meeting',topicId:s.topicId};cardState.cardMatches.push(row)}
   row.names=namesNow;row.key=key;row.type=namesNow.length===6?'6man':row.type;
 }
 return true;
}

// Candidatos apresentados na fala são sempre rechecados contra o SAVE e contra o POOL da vaga.
// A persona pode escrever uma brand errada; a UI nunca a aceita como verdade.
function meetingProposalCandidates(m,msg){
 const s=ensureState(m);
 const pools=currentMatchState(s,s.lastUserMessage||'').openSlotPools||[];
 if(!pools.length||!msg?.text)return [];
 const mentioned=mentionNames(msg.text);
 const out=[];
 for(const name of mentioned){
   const key=rosterFind(name)||name, w=S.roster[key]||{}, brand=String(w.brand||'');
   if(!brand)continue;
   const eligible=[];
   pools.forEach((pool,idx)=>{
     const wanted=fold(pool), actual=fold(brand);
     if(actual===wanted||actual.includes(wanted)||wanted.includes(actual))eligible.push({index:idx,pool});
   });
   if(eligible.length && !s.confirmed.some(x=>samePerson(x,key)) && !s.ineligible.some(x=>samePerson(x,key)))
     out.push({name:key,brand,pools:eligible});
 }
 return out;
}

function meetingRenderCardFromAi(m){
 const s=ensureState(m), cardState=meetingStateEnsure(m);
 if(!Array.isArray(cardState.cardMatches))cardState.cardMatches=[];
 const namesNow=uniq(s.confirmed).map(n=>rosterFind(n)||n);
 if(namesNow.length<2)return;
 const title=s.subjectTitles?.[0]||'';
 let row=cardState.cardMatches.find(x=>x&&x.source==='meeting'&&x.topicId===s.topicId);
 if(!row){row={key:'',names:[],type:'6man',st:'',title,source:'meeting',topicId:s.topicId};cardState.cardMatches.push(row)}
 row.names=namesNow; row.key=namesNow.map(canon).sort().join('|');
 row.title=title||row.title||'';
 row.type=namesNow.length===6?'6man':(namesNow.length===4?'fatal4':(namesNow.length===3?'triple':'singles'));
 // Reunião de PPV futuro: espelha a prévia no Criar Card do PPV.
 if(m.mode==='ppv'){
   try{
     const n=ppvOf(m), P=ppvPlan(n);
     if(n&&P){
       P.card=P.card||[];
       let pr=P.card.find(x=>x&&x.source==='meeting'&&x.meetingTopicId===s.topicId);
       if(!pr){pr={a:[],st:'',t:'',w:'',n:'Luta em planejamento',source:'meeting',meetingTopicId:s.topicId};P.card.push(pr)}
       pr.a=namesNow.slice(); pr.st=row.st||'6-Man Elimination'; pr.t=row.title||pr.t||'';
       pr.n=namesNow.length===6?'6-Man Elimination':(namesNow.length===4?'Fatal 4-Way':'Luta em planejamento');
     }
   }catch(e){console.warn('[PLW meeting PPV preview]',e)}
 }
}
window.meetingRenderCardFromAi=meetingRenderCardFromAi;

window.meetingApproveCandidate=function(i,name){
 const m=S.bookingMeeting;if(!m||m.confirmedAt)return;
 const msg=m.messages?.[i],s=ensureState(m);if(!msg||msg.role!=='persona')return;
 const cand=meetingProposalCandidates(m,msg).find(x=>samePerson(x.name,name));
 if(!cand)return toast('Esse nome não é elegível para nenhum pool aberto no SAVE.');
 const slot=cand.pools.find(x=>x.index>=0);
 if(!slot)return toast('Não há vaga compatível para esse nome.');
 s.ineligible=s.ineligible.filter(x=>!samePerson(x,cand.name));
 addUnique(s.confirmed,cand.name);
 s.openSlotPools.splice(slot.index,1);
 s.openSlots=Math.max(0,(s.openSlots||0)-1);
 if(!s.decisions.some(x=>x&&x.candidate&&samePerson(x.candidate,cand.name))){
   const d={text:`${cand.name} entra no card (${cand.brand})`,candidate:cand.name,brand:cand.brand,pool:slot.pool,source:'user-candidate-like',type:'booking',at:Date.now()};
   s.decisions.push(d);s.decisionHistory.push(d);
 }
 s.proposals=(s.proposals||[]).filter(p=>!(p&&mentionNames(p.text||'').some(n=>samePerson(n,cand.name))));
 s.rejectedCandidates=(s.rejectedCandidates||[]).filter(n=>!samePerson(n,cand.name));
 meetingRenderCardFromAi(m);
 persistAi(m);render();
 toast(`👍 ${cand.name} entrou no card. Vagas: ${s.openSlots}.`);
};

window.meetingRejectCandidate=function(i,name){
 const m=S.bookingMeeting;if(!m||m.confirmedAt)return;
 const msg=m.messages?.[i],s=ensureState(m);if(!msg||msg.role!=='persona')return;
 const cand=meetingProposalCandidates(m,msg).find(x=>samePerson(x.name,name));
 const key=cand?.name||rosterFind(name)||name;
 if(!(s.rejectedCandidates||[]).some(x=>samePerson(x,key)))s.rejectedCandidates.push(key);
 s.proposals=(s.proposals||[]).filter(p=>!(p&&mentionNames(p.text||'').some(n=>samePerson(n,key))));
 persistAi(m);render();
 toast(`👎 ${key} rejeitado. A vaga continua aberta.`);
};

function userStateAbsorb(m,q){
 const s=ensureState(m), text=clean(q), f=fold(text);
 const intent=detectIntent(text,s);
 const related=topicRelated(text,s,intent);
 if(!related || intent===INTENTS.NEW_TOPIC) newTopic(s,text,intent);
 else {s.intent=intent;s.question=text;s.mode=intent; if(!s.subject)s.subject=s.topic||clean(text).slice(0,220);}

 s.lastUserMessage=text;
 s.userMessages.push(text);
 if(s.userMessages.length>30)s.userMessages=s.userMessages.slice(-30);

 const mentioned=mentionNames(text);
 mentioned.forEach(n=>addUnique(s.subjectNames,n));


 // Participantes escritos diretamente na estrutura do card são confirmados para esta luta.
 // Isso não transforma sugestões das personas em decisões.
 explicitCardParticipants(text).forEach(n=>{
   const key=rosterFind(n)||n;
   s.ineligible=s.ineligible.filter(x=>!samePerson(x,key));
   addUnique(s.confirmed,key);
 });

 // Correções e restrições do usuário são estado, nunca saída da persona.
 // Uma restrição genérica como 'não quero campeões' NÃO torna os nomes citados na pergunta inelegíveis.
 const noChampRestriction=/\bnao quero que indiquem campe(?:a|ã)o|\bnão quero que indiquem campe(?:a|ã)o|\bnao quero\b.*\bcampe(?:a|ã)o|\bnão quero\b.*\bcampe(?:a|ã)o|\bnao pode\b.*\b(campe(?:a|ã)o|titulo|título)|\bnão pode\b.*\b(campe(?:a|ã)o|titulo|título)|\bsem campe(?:a|ã)os?\b|\bn[aã]o indicar campe(?:a|ã)os?\b/i.test(text);
 if(noChampRestriction){
   s.constraints.push('NÃO INDICAR CAMPEÕES ATUAIS DO SAVE');
 }
 if(/\b(nao pode|não pode|nao podem|não podem|nao entra|não entra|perdeu a qualificacao|perdeu a qualificação|perderam a qualificacao|perderam a qualificação|eliminad[oa]s?|inelegivel|inelegível|fora da disputa)\b/.test(f)){
   mentioned.forEach(n=>addUnique(s.ineligible,n));
   s.constraints.push(text);
 }
 if(/\b(já está|ja esta|já estão|ja estao|está na ladder|esta na ladder|estão na ladder|estao na ladder|confirmad[oa]s?|já tem luta|ja tem luta|foi escalad[oa]|está escalado|esta escalado)\b/.test(f)){
   mentioned.forEach(n=>{s.ineligible=s.ineligible.filter(x=>!samePerson(x,n));addUnique(s.confirmed,n)});
 }
 const nums=parseNumbers(text);
 if(nums!=null)s.openSlots=nums;
 // Se o usuário descreveu explicitamente os pools do card, preserve também a origem de cada vaga.
 const slotPools=[...(text.matchAll(/\bx\s*1\s*\(([^)]+)\)/gi))].map(m=>clean(m[1])).filter(Boolean);
 if(slotPools.length){
   s.openSlotPools=slotPools;
   s.constraints.push('OPEN SLOT POOLS: '+slotPools.join(', '));
 } else if(!Array.isArray(s.openSlotPools)) s.openSlotPools=[];

 // Decisões naturais como “gostei do Zack, coloca ele no card” alteram a luta.
 applyCardPlacementDecision(m,text);

 // Decisão explícita do usuário.
 const decision=/\b(vai ganhar|vai vencer|ser[aá] vencedor|fica decidido|ficou decidido|fechado|confirmo|confirmado|vamos com|vamos fazer|coloque\b.*\b(card|luta)|colocar\b.*\b(card|luta)|entra\b.*\b(card|luta)|vai\b.*\b(pro|para o)\s+card|pode colocar|grava isso|anota isso|salva isso|salvar isso|quero\b.*\b(ganhe|vença|esteja|fique|entre|coloque))\b/.test(f) && !noChampRestriction;
 const proposal=/\b(acho que|talvez|poderia|uma ideia|uma possibilidade|pensei em|o que acham|que tal)\b/.test(f);
 if(decision&&!proposal){
   const d={text,source:'user',type:'booking',at:Date.now()};
   if(!s.decisions.some(x=>x&&x.text===d.text)){s.decisions.push(d);s.decisionHistory.push(d);}
   s.proposals=[];
 }
 if(intent===INTENTS.CORRECTION && /\b(quero|fica|vai|vamos com)\b/.test(f)){
   const d={text,source:'user-correction',type:'booking',at:Date.now()};
   s.decisions=[d]; s.decisionHistory.push(d); s.proposals=[];
 }
 if(/\b(salva isso|salvar isso|anota isso|anotar isso|grava isso|fechado)\b/.test(f)){
   const lastProposal=s.proposals.slice(-1)[0];
   if(lastProposal && !s.decisions.some(d=>d.text===lastProposal.text)){
     const d={text:lastProposal.text,source:'user-explicit-save',type:'booking',at:Date.now()};
     if(!s.decisions.some(x=>x&&x.text===d.text)){s.decisions.push(d);s.decisionHistory.push(d);}s.proposals=[];
   }
 }
 if(intent===INTENTS.BOOKING_IDEA||intent===INTENTS.GIMMICK_IDEA||intent===INTENTS.TEAM_NAME||intent===INTENTS.NAME_GENERATION||intent===INTENTS.ROSTER_SELECTION||intent===INTENTS.WINNER_QUESTION||intent===INTENTS.STORY_BUILD){
   if(!decision)s.question=text;
 }
 return s;
}
window.meetingStateEnsure=ensureState;
window.meetingUpdateFromUser=userStateAbsorb;

function currentMatchState(s,q){
 const text=clean(q), f=fold(text);
 const title=(s.subjectTitles[0]||titleHits(text)[0]||'');
 const event=(s.subjectEvents[0]||eventHits(text)[0]||'');
 const confirmed=uniq(s.confirmed), inel=uniq(s.ineligible);
 let open=s.openSlots||0;
 const ladder=/ladder/.test(f);
 if(!open && ladder){
   const m=f.match(/\b(\d+)\s*(?:vagas?|slots?)\b/); if(m)open=+m[1];
 }
 return {title,event,stip:/ladder/.test(f)?'Ladder Match':'',confirmed,ineligible:inel,openSlots:open,openSlotPools:Array.isArray(s.openSlotPools)?s.openSlotPools.slice():[],question:text};
}

function matchStateBlock(ms){
 if(!ms||(!ms.title&&!ms.event&&!ms.confirmed.length&&!ms.ineligible.length&&!ms.openSlots))return '';
 return [
  'MATCH STATE',
  'TITLE: '+(ms.title||'não informado'),
  'EVENT: '+(ms.event||'não informado'),
  'STIPULATION: '+(ms.stip||'não informado'),
  'CONFIRMED: '+(ms.confirmed.join(', ')||'nenhum'),
  'OPEN SLOTS: '+(ms.openSlots||0),
  'OPEN SLOT POOLS: '+(ms.openSlotPools.join(', ')||'não especificados'),
  'INELIGIBLE: '+(ms.ineligible.join(', ')||'nenhum'),
  'CURRENT QUESTION: '+ms.question
 ].join('\n');
}

 TITLES.forEach(t=>{const c=clean((S.titles[t[0]]||{}).champ);if(c&&c!=='—'&&c!=='-')addUnique(out,c)});

function rosterCandidatesForPool(s,q,poolName){
 const ms=currentMatchState(s,q), noChamp=/\b(nao quero|não quero|nao pode|não pode|sem)\b[^.!?]{0,70}\b(campe(?:a|ã)o|titulo|título|champion)/i.test(q);
 const champs=new Set(noChamp?currentSaveChampions().map(canon):[]), blocked=new Set([...(ms.confirmed||[]),...(ms.ineligible||[]),...champs].map(canon));
 const wanted=fold(poolName||'');
 const normalizeBrand=b=>{let x=fold(b);try{if(typeof bk==='function'){const k=fold(bk(b));if(k)x+=' '+k}}catch(e){}return x};
 const pool=names().filter(n=>!blocked.has(canon(n))).filter(n=>{
   const w=S.roster[n]||{},status=fold(w.status||'');
   if(w.inj||w.susp||status.includes('lesionado')||status.includes('suspenso'))return false;
   if(!wanted)return true;
   const b=normalizeBrand(w.brand||'');
   return b===wanted || b.includes(wanted) || wanted.includes(b) || (wanted.includes('motion')&&b.includes('motion')) || (wanted.includes('show off')&&b.includes('show off')) || (wanted.includes('plwar')&&b.includes('plwar'));
 });
 const scored=pool.map(n=>{const w=S.roster[n]||{},msr=wrestlerMatches(n),recent=msr.slice(-5),wins=recent.filter(x=>canon(x.winner)===canon(n)).length;return{name:n,score:(+w.w||0)-(+w.l||0)+wins*2,recentWins:wins,w:+w.w||0,l:+w.l||0,brand:w.brand||''}}).sort((a,b)=>b.score-a.score).slice(0,20);
 return scored;
}
function rosterCandidatesByPools(s,q){

function rosterCandidates(s,q){
 const ms=currentMatchState(s,q);
 const noChamp=/\bnao quero que indiquem campe(?:a|ã)o|\bnão quero que indiquem campe(?:a|ã)o|\bnao quero\b.*\bcampe(?:a|ã)o|\bnão quero\b.*\bcampe(?:a|ã)o|\bnao pode\b.*\b(campe(?:a|ã)o|titulo|título)|\bnão pode\b.*\b(campe(?:a|ã)o|titulo|título)|\bsem campe(?:a|ã)os?\b|\bn[aã]o indicar campe(?:a|ã)os?\b/i.test(q);
 const blocked=new Set([...ms.confirmed,...ms.ineligible,...(noChamp?currentSaveChampions():[])].map(canon));
 const mentioned=mentionNames(q);
 let pool=names().filter(n=>!blocked.has(canon(n)));
 pool=pool.filter(n=>{
   const w=S.roster[n]||{};
   return !(w.inj||w.susp||w.status==='lesionado'||w.status==='suspenso');
 });
 const title=ms.title?TITLES.find(t=>t[0]===ms.title):null;
 if(title && title[1]!=='GLOBAL'){
   const brand=title[1]==='MOTION'?'MOTION':title[1]==='SHOW OFF'?'SHOW OFF':title[1];
   pool=pool.filter(n=>{
     const b=fold((S.roster[n]||{}).brand||'');
     return !brand || b.includes(fold(brand));
   });
 }
 const scored=pool.map(n=>{
   const w=S.roster[n]||{}, msr=wrestlerMatches(n);
   const recent=msr.slice(-5), wins=recent.filter(x=>canon(x.winner)===canon(n)).length;
   return {name:n,score:(w.w||0)-(w.l||0)+wins*2,recentWins:wins,w:w.w||0,l:w.l||0,brand:w.brand||''};

}

function buildCanonContext(q,s,intent){
 const n=mentionNames(q), ms=currentMatchState(s,q), pieces=[];
 if(intent===INTENTS.BOOKING_IDEA && isMatchFormatQuestion(q)) pieces.push('FORMATOS DE LUTA DISPONÍVEIS PARA PROPOSTA — escolha somente formatos jogáveis desta biblioteca: '+gameMatchFormatsText()+'. Isto é uma biblioteca de booking, não um fato histórico do SAVE.');
 pieces.push('SAVE / CANON — fonte única para fatos passados. Nunca trate ausência como permissão para inventar.');
 if(n.length) n.slice(0,5).forEach(x=>pieces.push(wrestlerFact(x)));
 if(intent===INTENTS.CANON_QUERY || intent===INTENTS.WINNER_QUESTION){
   const related=allMatches().filter(m=>{
     const hay=fold([m.event,m.championship,m.stipulation,...(m.participants||[])].join(' '));
     return n.some(x=>hay.includes(fold(x))) || (ms.event&&hay.includes(fold(ms.event))) || (ms.title&&hay.includes(fold(ms.title)));
   }).slice(-8);
   if(related.length)pieces.push('REGISTROS RELEVANTES:\n'+related.map(m=>`${m.event||'?'}: ${(m.participants||[]).join(' x ')} -> ${m.winner||'empate'}${m.championship?' | '+m.championship:''}`).join('\n'));
 }
 if(intent===INTENTS.ROSTER_SELECTION){
   const grouped=rosterCandidatesByPools(s,q);
   if(grouped.length){
     pieces.push('CANDIDATOS ELEGÍVEIS POR VAGA/POOL DO CARD — REGRA RÍGIDA: cada nome só pode ser usado na VAGA/POOL em que aparece; nunca troque ou deduza a brand.\n'+grouped.map(g=>`VAGA ${g.index} — POOL EXATO: ${g.pool}: `+(g.candidates.slice(0,8).map(x=>`${x.name} [BRAND SAVE: ${x.brand||'?'}]`).join(', ')||'nenhum candidato')).join('\n'));
   } else {
     const c=rosterCandidates(s,q);
     pieces.push('CANDIDATOS ELEGÍVEIS DO SAVE (já filtrados contra confirmados/inelegíveis/lesionados):\n'+(c.candidates.map(x=>`${x.name} — ${x.w}-${x.l}, ${x.brand||'?'}; vitórias recentes no recorte: ${x.recentWins}`).join('\n')||'nenhum'));
   }
 }

 if(intent===INTENTS.CANON_QUERY && !n.length)pieces.push('CAMPEÕES ATUAIS: '+(held.join(' | ')||'nenhum registrado'));
 return pieces.join('\n').slice(0,8500);
}

function normalizeRosterSelectionResponse(key,s,q,out){

   const list=g.candidates||[];
   let pick=list.find(c=>mentioned.some(n=>samePerson(n,c.name))&&!used.has(canon(c.name)));
   if(!pick&&list.length){
     const available=list.filter(c=>!used.has(canon(c.name)));
     pick=available[(offset+gi)%Math.max(1,available.length)]||available[0]||null;
   }
   if(pick)used.add(canon(pick.name));
   return pick;
 });
 if(picks.some(x=>!x))return 'Não há candidatos suficientes no roster para preencher todos os pools abertos.';
 const intro={jj:'Eu fecharia as vagas assim:',tony:'Eu iria nestes nomes:',gendo:'Eu reduziria a escolha a:',hal:'Minha seleção objetiva é:'}[key]||'Minha seleção:';
 return intro+' '+picks.map((x,i)=>`${groups[i].pool}: ${x.name}`).join(' • ')+'.';
}

 if(s.intent===INTENTS.ROSTER_SELECTION && (s.openSlotPools||[]).length) out=normalizeRosterSelectionResponse(key,s,q,out);
 let issues=forbiddenClaims(out,s,q);
 if(issues.length){
   const retry=prompt+'\n\nVALIDAÇÃO FALHOU: '+issues.join('; ')+'. Gere novamente sem esses erros. Responda somente à pergunta atual.';
   try{
     await bookerSample(retry,{engine:K.engine,system:baseSystem(key),maxTok:key==='hal'?420:520,onText:x=>{out=String(x?.text||'')}});

   out=sanitize(out,key,s,q);
   if(s.intent===INTENTS.ROSTER_SELECTION && (s.openSlotPools||[]).length) out=normalizeRosterSelectionResponse(key,s,q,out);
   issues=forbiddenClaims(out,s,q);
 }
 if(issues.length||!out)out=fallback(key,s,q);
 return {text:out,issues};
}

<script>
/* ===== SAVE EM PASTA: escolhe a pasta uma vez; botão 🔄 lê o arquivo mais recente e atualiza o app ===== */
(function(){
'use strict';
if(window.__PLW_SAVEDIR__)return;window.__PLW_SAVEDIR__=true;
const OK=typeof window.showDirectoryPicker==='function';
const EXT=/\.(txt|gz|json|sav|save)$/i;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('plw-savedir',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('dir');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function hSet(h){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(h,'dir');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function hDel(){try{const d=await idb();const t=d.transaction('h','readwrite');t.objectStore('h').delete('dir')}catch(e){}}
async function perm(h,ask){
  const o={mode:'read'};
  if((await h.queryPermission(o))==='granted')return true;
  return ask&&(await h.requestPermission(o))==='granted';
}
async function newest(h){
  let best=null;
  for await(const [name,e] of h.entries()){
    if(e.kind!=='file'||!EXT.test(name))continue;
    const f=await e.getFile();
    if(!best||f.lastModified>best.lastModified)best=f;
  }
  return best;
}
window.saveDirPick=async function(){
  if(!OK)return toast('Esse navegador não deixa vincular pasta. Use Chrome ou Edge no computador.');
  try{
    const h=await window.showDirectoryPicker({id:'plw-save',mode:'read'});
    await hSet(h);
    toast('📁 Pasta vinculada: '+h.name);
    await window.saveDirRefresh();
  }catch(e){if(e&&e.name!=='AbortError')toast('Não consegui vincular a pasta: '+(e.message||e.name))}
};
window.saveDirRefresh=async function(){
  if(!OK)return toast('Esse navegador não deixa ler pasta. Use Chrome ou Edge no computador.');
  const h=await hGet();
  if(!h)return window.saveDirPick();
  try{
    if(!(await perm(h,true)))return toast('Sem permissão para ler a pasta. Toque em 🔄 de novo e permita.');
    const f=await newest(h);
    if(!f)return toast('Nenhum arquivo de save (.txt, .gz, .json) na pasta '+h.name+'.');
    toast('🔄 Lendo '+f.name+'...');
    await readSave(f);
    try{localStorage.setItem('plw-savedir-last',JSON.stringify({name:f.name,mod:f.lastModified,at:Date.now()}))}catch(e){}
    if(typeof render==='function')render();
  }catch(e){toast('Erro ao atualizar: '+(e.message||e.name))}
};
window.saveDirForget=async function(){await hDel();try{localStorage.removeItem('plw-savedir-last')}catch(e){}toast('Pasta desvinculada.');if(typeof render==='function')render()};
function card(){
  let last=null;try{last=JSON.parse(localStorage.getItem('plw-savedir-last')||'null')}catch(e){}
  const info=last?'Última leitura: <b>'+String(last.name).replace(/[<>&]/g,'')+'</b> (arquivo de '+new Date(last.mod).toLocaleString('pt-BR')+')':'Ainda não atualizou por aqui.';
  if(!OK)return '<div class="card"><h3>📁 Save em pasta</h3><div class="mut">Esse navegador não suporta vincular pasta. No Chrome ou Edge do computador funciona.</div></div>';
  return '<div class="card"><h3>📁 Save em pasta</h3><div class="mut">Deixe o save do jogo numa pasta. Vincule uma vez; depois, sempre que baixar um save novo lá, é só tocar em Atualizar (lê o arquivo mais recente da pasta).</div><div class="mut" style="margin-top:6px">'+info+'</div><div class="row" style="margin-top:8px"><button class="btn o" onclick="saveDirRefresh()">🔄 Atualizar save</button><button class="btn s" onclick="saveDirPick()">Escolher pasta</button><button class="btn s" onclick="saveDirForget()">Desvincular</button></div></div>';
}
const _v=window.vSys;
if(typeof _v==='function')window.vSys=vSys=function(){return _v.apply(this,arguments)+card()};
console.log('[PLW] Save em pasta pronto ('+(OK?'suportado':'navegador sem suporte')+')');
})();
</script>
<script>/* ===== PLW FINAL FIX PACK — JOW booking meeting + press ===== */
(function(){
'use strict';
if(window.__PLW_FINAL_FIX_PACK__) return;
window.__PLW_FINAL_FIX_PACK__=true;

const cleanF=x=>String(x??'').replace(/\s+/g,' ').trim();
const foldF=x=>cleanF(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const canonF=x=>typeof plwCanonicalName==='function'?plwCanonicalName(cleanF(x)):cleanF(x);
const sameF=(a,b)=>canonF(a)===canonF(b);
const uniqF=a=>[...new Set((a||[]).filter(Boolean).map(canonF))];
/* O CLEAN CORE mantém mentionNames dentro do próprio IIFE. Este pacote final
   também precisa de um extrator local: os botões 👍/👎 não podem depender de
   uma função lexical que não está no escopo global. */
const mentionNamesF=function(text){
  const raw=cleanF(text), out=[];
  const roster=S&&S.roster&&typeof S.roster==='object'?S.roster:{};
  const names=Object.keys(roster).filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const n of names){
    const re=new RegExp('(^|[^A-Za-zÀ-ÿ0-9])'+String(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^A-Za-zÀ-ÿ0-9])','i');
    if(re.test(raw)&&!out.some(x=>sameF(x,n)))out.push(n);
  }
  return out;
};

/* ---------- 1) estado de reunião: uma fonte segura ---------- */
function aiStateSafe(m){
  if(typeof window.meetingStateEnsure==='function')return window.meetingStateEnsure(m||{});
  const x=m||{};x.aiState=x.aiState||{};const s=x.aiState;
  ['decisions','constraints','confirmed','ineligible','proposals','subjectNames','subjectTitles','subjectEvents','userMessages','decisionHistory','validationIssues','rejectedCandidates','openSlotPools'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  if(typeof s.openSlots!=='number')s.openSlots=0;return s;
}
window.meetingRenderCardFromAi=function(m){
  const s=aiStateSafe(m); if(typeof window.meetingStateEnsure==='function'){
    try{
