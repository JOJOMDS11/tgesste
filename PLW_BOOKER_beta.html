/* ===== PLW V32 — LOCK duro: "vamos de X x Y" fecha e as vozes NÃO reabrem ===== */
(function(){
  const C = n => typeof plwCanonicalName==='function' ? plwCanonicalName(String(n||'')) : String(n||'').trim();
  const fold = t => String(t||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\s+/g,' ').trim();

  function debate(m){
    const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : (m._st||(m._st={}));
    if(!s.debate || typeof s.debate!=='object') s.debate = {};
    const d = s.debate;
    if(!Array.isArray(d.lockedMatches)) d.lockedMatches = [];
    if(!Array.isArray(d.rejected)) d.rejected = [];
    if(!Array.isArray(d.proposed)) d.proposed = [];
    if(!Array.isArray(d.liked)) d.liked = [];
    return d;
  }

  function parseLockPair(raw){
    /* VAMOS DE GUNTHER X Jon Moxley / É GUNTHER vs Moxley / fechado GUNTHER x Moxley */
    const f = fold(raw);
    if(!/(vamos\s+de|fechad|confirmad|decidid|\bok\b|pode\s+ser|vai\s+(ser|lutar)|[ée]\s+\w)/i.test(raw) && !/\bx\b|\bvs\b|\bversus\b/i.test(raw)){
      /* still allow "GUNTHER x Moxley no Final Battle" style */
      if(!/\bx\b|\bvs\b/i.test(raw)) return null;
    }
    let names = [];
    try{ names = (typeof resolveRosterMentions==='function'?resolveRosterMentions(raw):[]).map(C).filter(Boolean); }catch(e){}
    if(names.length>=2) return [names[0], names[1]];
    /* fallback split on x/vs */
    const m = String(raw).match(/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{1,40})\s*(?:x|vs\.?|versus)\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{1,40})/i);
    if(m){
      try{
        const a=(typeof resolveRosterMentions==='function'?resolveRosterMentions(m[1]):[])[0];
        const b=(typeof resolveRosterMentions==='function'?resolveRosterMentions(m[2]):[])[0];
        if(a&&b) return [C(a),C(b)];
      }catch(e){}
    }
    return null;
  }

  function forceLock(m, text){
    const d = debate(m);
    const raw = String(text||'');
    const pair = parseLockPair(raw);
    if(!pair) return false;
    const intentLock = /(vamos\s+de|fechad|confirmad|decidid|\bok\b|[ée]\s+gunther|gunther\s+[ée]|vai\s+ser|pode\s+ser)/i.test(raw)
      || (/\bx\b|\bvs\b/i.test(raw) && /(final\s*battle|main|fech|ok)/i.test(raw));
    if(!intentLock && !/(vamos\s+de)/i.test(raw)) return false;

    const key = [pair[0],pair[1]].sort().join('|');
    if(!d.lockedMatches.some(x=>x.key===key)){
      d.lockedMatches.push({key, names:[pair[0],pair[1]], event:'Final Battle', note:'fechado pelo head booker'});
    }
    d.mode = 'locked';
    d.topic = pair[0]+' x '+pair[1]+' FECHADO';
    d.liked = [...new Set((d.liked||[]).concat(pair))];
    /* mark in meeting state card */
    try{
      const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : {};
      if(!Array.isArray(s.cardMatches)) s.cardMatches = [];
      if(!s.cardMatches.some(x=>(x.names||[]).map(C).sort().join('|')===key)){
        s.cardMatches.push({key, names:[pair[0],pair[1]], st:'', title:'', source:'meeting'});
      }
      if(!Array.isArray(s.cardPairs)) s.cardPairs = [];
      if(!s.cardPairs.some(x=>(x.names||[]).map(C).sort().join('|')===key))
        s.cardPairs.push({names:[pair[0],pair[1]]});
    }catch(e){}
    return true;
  }

  /* wrap absorb on update + run */
  const _mu = window.meetingUpdateFromUser;
  if(typeof _mu==='function'){
    window.meetingUpdateFromUser = function(m, text){
      try{ forceLock(m, text); }catch(e){}
      return _mu.apply(this, arguments);
    };
  }

  const lockTask = function(key, d){
    const locks = (d.lockedMatches||[]).map(l=>(l.names||[]).join(' x ')).join('; ');
    if(key==='jj') return 'O head booker FECHOU: '+locks+'. Confirme em 1 frase e PARE. Não ofereça outro oponente. Se ele só confirmou, diga que está anotado no card e pergunte o próximo assunto.';
    if(key==='gendo') return 'Luta FECHADA: '+locks+'. Não troque o oponente. No máximo 1 frase de ângulo para ESSA luta, ou diga "fechado, próximo".';
    if(key==='tony') return 'Luta FECHADA: '+locks+'. Só um detalhe de build/stip para ESSA luta (2 semanas). Sem nomes novos no main.';
    if(key==='hal') return 'Luta FECHADA: '+locks+'. Confirme se os dois estão livres no card. Sem sugerir outro nome.';
    return 'Luta fechada. Não reabra.';
  };

  const _bp = window.buildPrompt;
  if(typeof _bp==='function'){
    window.buildPrompt = function(key, plan, m, message, round, extra){
      try{
        const u=(m.messages||[]).filter(x=>x.role==='user').slice(-1)[0];
        if(u) forceLock(m, u.text);
      }catch(e){}
      let p = _bp(key, plan, m, message, round, extra);
      const d = debate(m);
      if((d.lockedMatches||[]).length && (d.mode==='locked' || /vamos\s+de|fechad|confirmad/i.test(d.lastUser||''))){
        const task = lockTask(key, d);
        p = p.replace(/SUA TAREFA AGORA:[\s\S]*?(?=REGRA DE CONTINUIDADE:|# IDENTIDADE|# V28|# V32|Responda somente|$)/, 'SUA TAREFA AGORA: '+task+'\n');
        p += '\n\n# LOCK V32\nLUTAS FECHADAS: '+(d.lockedMatches.map(l=>(l.names||[]).join(' x ')).join(' | '))+'\nPROIBIDO sugerir outro oponente para o mesmo main. Confirme e pare.\n';
      }
      return p;
    };
  }

  const _ct = window.checkText;
  if(typeof _ct==='function'){
    window.checkText = function(text, plan, key){
      let issues = [];
      try{ issues = _ct(text, plan, key)||[]; }catch(e){}
      try{
        const m = S.bookingMeeting;
        const d = debate(m||{});
        if((d.lockedMatches||[]).length){
          const locked = new Set();
          d.lockedMatches.forEach(lm=>(lm.names||[]).forEach(n=>locked.add(C(n))));
          /* if proposing a different singles opponent for focal */
          const used = (typeof resolveRosterMentions==='function'?resolveRosterMentions(text):[]).map(C);
          const focal = d.focal || (d.lockedMatches[0]&&d.lockedMatches[0].names&&d.lockedMatches[0].names.find(n=>/moxley/i.test(n)));
          const extra = used.filter(n=>{
            if(locked.has(C(n))) return false;
            if(focal && C(n)===C(focal)) return false;
            return true;
          });
          /* if text still "melhor é X" with X not locked for main */
          if(/melhor [eé]|eu iria de|vamos de|oponente|enfrentar|advers[aá]rio/i.test(String(text||'')) && extra.length && d.mode==='locked'){
            issues.push('Main FECHADO. Não proponha outro nome. Só confirme a luta fechada.');
          }
        }
      }catch(e){}
      return issues;
    };
  }

  /* meetingRunPanel: if just locked, only 2 voices confirm */
  const _run = window.meetingRunPanel;
  if(typeof _run==='function'){
    window.meetingRunPanel = async function(phase, userText){
      const meeting = S.bookingMeeting;
      if(meeting && userText){
        try{
          if(forceLock(meeting, userText)){
            /* short confirmation round handled by normal run with locked mode */
            const d = debate(meeting);
            d.mode = 'locked';
          }
        }catch(e){}
      }
      return _run.apply(this, arguments);
    };
  }

  /* stronger speakersFor via buildPrompt path — patch role if locked in stateBlock by post-filtering messages is heavy; rely on task */

  console.log('[PLW] V32 — lock GUNTHER x Moxley respeitado');
})();

/* ===== PLW V33 — lock à prova de modelo + input logo após última fala ===== */
(function(){
  const C = n => typeof plwCanonicalName==='function' ? plwCanonicalName(String(n||'')) : String(n||'').trim();
  const fold = t => String(t||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\s+/g,' ').trim();

  function debate(m){
    const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : (m._st||(m._st={}));
    if(!s.debate || typeof s.debate!=='object') s.debate = {};
    const d = s.debate;
    if(!Array.isArray(d.lockedMatches)) d.lockedMatches = [];
    if(!Array.isArray(d.rejected)) d.rejected = [];
    if(!Array.isArray(d.liked)) d.liked = [];
    if(!d.mode) d.mode = 'discuss';
    return d;
  }

  function resolveNames(raw){
    let names = [];
    try{ names = (typeof resolveRosterMentions==='function'?resolveRosterMentions(raw):[]).map(C).filter(Boolean); }catch(e){}
    if(names.length>=2) return names;
    /* hard fallback for common spellings */
    const roster = Object.keys(S.roster||{});
    const f = fold(raw);
    const found = [];
    roster.forEach(n=>{
      const fn = fold(n);
      if(fn.length>=3 && f.includes(fn)) found.push(C(n));
    });
    /* gunther special */
    if(/gunther|guntner|gunther/i.test(raw) && !found.some(n=>/gunther/i.test(n))){
      const g = roster.find(n=>/gunther/i.test(n));
      if(g) found.push(C(g));
    }
    if(/moxley/i.test(raw) && !found.some(n=>/moxley/i.test(n))){
      const g = roster.find(n=>/moxley/i.test(n));
      if(g) found.push(C(g));
    }
    return [...new Set(found)];
  }

  function isLockPhrase(raw){
    const f = fold(raw);
    /* NÃO usar "pode ser" sozinho — "nao pode ser X" é veto, não lock */
    if(/(nao|n[aã]o)\s+pode\s+ser/i.test(raw)) return false;
    if(/(vamos\s+de|fechamos\s+a\s+luta|fechamos:|ta\s+fechado|t[aá]\s+fechado|fechad[oa]:|confirmad[oa]:|decidid[oa])/i.test(raw)) return true;
    if(/\bvamos\s+de\b/i.test(raw) && (/\bx\b|\bvs\b/i.test(raw))) return true;
    if(/^[ée]\s+\w+/i.test(raw.trim()) && (/\bx\b|\bvs\b/i.test(raw))) return true;
    return false;
  }

  function forceLock(m, text){
    const d = debate(m);
    const raw = String(text||'').trim();
    if(!raw || !isLockPhrase(raw)) return false;
    /* prioriza o par depois de "vamos de" / "fechamos" */
    let names = [];
    const mPair = raw.match(/(?:vamos\s+de|fechamos(?:\s+a\s+luta)?(?::)?|[ée])\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{1,40})\s*(?:x|vs\.?|versus)\s*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{1,40})/i);
    if(mPair){
      try{
        const a=(typeof resolveRosterMentions==='function'?resolveRosterMentions(mPair[1]):[])[0];
        const b=(typeof resolveRosterMentions==='function'?resolveRosterMentions(mPair[2]):[])[0];
        if(a&&b) names=[C(a),C(b)];
      }catch(e){}
    }
    if(names.length<2) names = resolveNames(raw);
    if(names.length < 2){
      /* "fechamos a luta do Moxley" without opponent — if liked/previous gunther */
      if(/moxley/i.test(raw) && (d.liked||[]).length){
        const other = d.liked.find(n=>!/moxley/i.test(n));
        const mox = names.find(n=>/moxley/i.test(n)) || resolveNames('Jon Moxley')[0];
        if(other && mox) names.push(other, mox);
      }
      if(names.length < 2) return false;
    }
    const a = names[0], b = names[1];
    const key = [C(a),C(b)].sort().join('|');
    if(!d.lockedMatches.some(x=>x.key===key)){
      d.lockedMatches.push({key, names:[C(a),C(b)], event:'Final Battle', note:'fechado'});
    }
    d.mode = 'locked';
    d.topic = C(a)+' x '+C(b)+' FECHADO';
    d.lastUser = raw;
    d.liked = [...new Set((d.liked||[]).concat([C(a),C(b)]))];
    try{
      const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : {};
      if(!Array.isArray(s.cardMatches)) s.cardMatches = [];
      if(!s.cardMatches.some(x=>(x.key||'')===key)){
        s.cardMatches.push({key, names:[C(a),C(b)], st:'', title:'', source:'meeting'});
      }
    }catch(e){}
    console.log('[PLW] LOCK', a, 'x', b);
    return true;
  }

  function confirmText(key, lock){
    const pair = (lock.names||[]).join(' x ');
    if(key==='jj') return 'Fechado: '+pair+' no Final Battle. Anotado no card. Qual o próximo assunto?';
    if(key==='gendo') return 'Ok, '+pair+' está trancado. Sem trocar o main — próximo tema.';
    if(key==='tony') return 'Build de 2–3 semanas para '+pair+': confronto, elevação, estouro no PPV.';
    return 'Card: '+pair+' livre no que o save mostra. Luta fechada.';
  }

  /* intercept meetingRunPanel — se lock, respostas forçadas curtas */
  const _run = window.meetingRunPanel;
  window.meetingRunPanel = async function(phase, userText){
    const meeting = S.bookingMeeting;
    if(!meeting) return;
    const raw = userText!=null ? String(userText).trim() : '';
    let lockedNow = false;
    try{
      lockedNow = forceLock(meeting, raw);
      if(!lockedNow && raw){
        const u = (meeting.messages||[]).filter(x=>x.role==='user').slice(-1)[0];
        if(u) lockedNow = forceLock(meeting, u.text);
      }
    }catch(e){ console.warn(e); }

    const d = debate(meeting);
    if(d.mode==='locked' && (d.lockedMatches||[]).length && (lockedNow || isLockPhrase(raw))){
      /* NÃO chama o modelo para reabrir — confirma e para */
      if(busy) return toast('Espere.');
      busy = true; window.__mtgRunning = true;
      const token = meeting.runId = String(Date.now());
      const lock = d.lockedMatches[d.lockedMatches.length-1];
      const keys = ['jj','gendo','tony','hal'];
      try{
        for(const key of keys){
          if(S.bookingMeeting!==meeting || meeting.runId!==token) break;
          const message = {role:'persona', persona:key, text: confirmText(key, lock), id:Date.now()+meeting.messages.length};
          meeting.messages.push(message);
          persist(); if(typeof tab!=='undefined' && tab==='meeting') render();
        }
      } finally {
        busy = false; window.__mtgRunning = false;
        persist(); if(typeof tab!=='undefined' && tab==='meeting') render();
      }
      return;
    }

    if(typeof _run==='function') return _run.apply(this, arguments);
  };

  const _mu = window.meetingUpdateFromUser;
  if(typeof _mu==='function'){
    window.meetingUpdateFromUser = function(m, text){
      try{ forceLock(m, text); }catch(e){}
      return _mu.apply(this, arguments);
    };
  }

  /* ---- INPUT logo após a última mensagem ---- */
  const _v = window.vMeeting;
  window.vMeeting = function(){
    let h = _v ? _v() : '';
    const m = S.bookingMeeting;
    if(!m) return h;

    /* extrai send box se existir */
    let send = '';
    const ta = h.match(/<textarea id="meeting-input"[\s\S]*?<\/textarea>/);
    const btn = h.match(/<button[^>]*onclick="sendMeetingMessage\(\)"[^>]*>[\s\S]*?<\/button>/);
    if(ta){
      /* remove ocorrências atuais do input/send */
      h = h.replace(/<div class="card"[^>]*id="meeting-send-box"[\s\S]*?<\/div>/g, '');
      h = h.replace(/<div class="card">\s*<label class="mut">[^<]*<\/label>\s*<textarea id="meeting-input"[\s\S]*?<\/textarea>\s*(?:<button[^>]*sendMeetingMessage[\s\S]*?<\/button>\s*)?<\/div>/g, '');
      if(h.includes(ta[0])) h = h.replace(ta[0], '');
      if(btn && h.includes(btn[0])) h = h.replace(btn[0], '');
      send = '<div class="card" id="meeting-send-box" style="margin:10px 0;border:1px solid rgba(106,13,173,.45)">'
        +'<label class="mut">💬 Sua fala (logo abaixo da conversa)</label>'
        +ta[0]
        +(btn ? btn[0] : '<button class="btn o" style="width:100%;margin-top:6px" onclick="sendMeetingMessage()">Enviar para a equipe</button>')
        +'</div>';
    }

    if(send){
      /* inserir após a ÚLTIMA bolha de fala (bub) */
      const bubRe = /<div class="bub[\s\S]*?<\/div>/g;
      let lastEnd = -1, match;
      while((match = bubRe.exec(h)) !== null){
        lastEnd = match.index + match[0].length;
      }
      if(lastEnd > 0){
        h = h.slice(0, lastEnd) + send + h.slice(lastEnd);
      } else {
        /* após sec reunião / card header */
        const mark = h.indexOf('Lutadores em pauta');
        if(mark > 0) h = h.slice(0, mark) + send + h.slice(mark);
        else h = send + h;
      }
    }

    /* mostra locks no topo da lousa se houver */
    try{
      const d = debate(m);
      if((d.lockedMatches||[]).length){
        const line = '<div class="card" style="--c:#2ecc71;margin:8px 0"><b>✅ Lutas fechadas</b><div>'+
          d.lockedMatches.map(l=>(l.names||[]).join(' × ')+(l.event?' · '+l.event:'')).join('<br>')+
          '</div><div class="mut">As vozes não podem trocar esses nomes.</div></div>';
        if(!h.includes('Lutas fechadas')){
          const i = h.indexOf('LOUSA')>=0 ? h.indexOf('LOUSA') : h.indexOf('MINI-CARD');
          if(i>0) h = h.slice(0,i)+line+h.slice(i);
          else h = line+h;
        }
      }
    }catch(e){}

    return h;
  };

  console.log('[PLW] V33 — lock forçado (sem modelo) + input após última fala');
})();
</script>

<script>
/* ===== PLW_MTG_CANON_GUARD — correção cirúrgica da Reunião de Booking =====
   CAUSA: o runner ativo da reunião é V28 (linha ~4299) embrulhado por V32/V33. Ele monta o prompt com
   window.buildPrompt (V3 + wrappers), que NÃO inclui o SAVE CANON: buildMeetingContext() só era chamado
   pelos runners V1/V2, hoje sobrescritos. E o checkText do V3 só enxerga nomes que EXISTEM no roster,
   então nome inventado ("Viper", "Rook"...) passa batido.
   ESTE BLOCO:
   1) injeta SAVE CANON + ELENCO VÁLIDO no prompt de cada voz;
   2) audita a fala (nome fora do roster; nota, empate, sequência, confronto passado e rivalidade sem base
      no save; nome rejeitado pelo head booker) e remove a frase antes de exibir;
   3) faz o checkText acusar o problema, para o V28 refazer a fala uma vez com correção.
   NÃO mexe em callBookerAI, bookerSample, llama.cpp nem no modo solo. */
(function(){
 'use strict';
 if(window.__PLW_MTG_CANON_GUARD__)return;
 window.__PLW_MTG_CANON_GUARD__=true;
 try{
 const F=s=>plwFold(s),CN=n=>plwCanonicalName(n);
 const uniq=a=>[...new Set(a)];
 const cap=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n).replace(/\s+\S*$/,'')+' …':s};

 /* palavras que nunca são "lutador inventado": estruturais, estipulações, meses, eventos do calendário */
 const BASE=new Set(('plw plwar motion show off purple league wrestling journey of head booker jj gendo ikari dirk analista creative room hal tony '
  +'ppv tv dq global world tag team championship title titulo campeonato cinturao brand roster card main event ladder cage steel tables street fight '
  +'last man standing quit iron falls count fatal way triple threat gauntlet battle royal rumble hell cell tlc elimination chamber scramble submission '
  +'cash mania build ideia sim nao ok fechado concordo discordo janeiro fevereiro marco abril maio junho julho agosto setembro outubro novembro dezembro '
  +'segunda terca quarta quinta sexta sabado domingo brasil final collision coliseum reign beast mode eye blackout high life new level super aces august madness raindrops').split(' '));

 const NEG=/\bfora\b|\bsem\b|descart|\bsai\b|\bnao\b|rejeit|vetad|\bja (tem|esta|foi)\b/;
 const PAST=/\b(derrotou|venceu|bateu|superou|ganhou de|perdeu (para|de|pra)|enfrentou|enfrentaram|lutaram|lutou|se enfrentaram|ja (se )?enfrent\w+|revanche|rematch)\b/;
 const FEUD=/\b(rivalidade|rixa|feud)\b/;
 const FUT=/\b(criar|construir|iniciar|comecar|abrir|nova|novo|build|ideia|poderia|podemos|vamos|vai|seria|sera|proponho)\b/;
 const STREAK=/sequ[eê]ncia de (\d+)|(\d+) (?:vit[oó]rias|lutas) (?:seguidas|consecutivas)|invicto/i;
 const STARTNEXT=new Set('vs x contra enfrenta enfrentando derrota derrotou vence venceu perde perdeu luta lutou merece ganha ganhou entra entrou volta fecha deveria deve pode poderia seria vai e esta estava tem teve foi ja nunca com tambem continua segue sai sobe precisa quer defende defendeu bate bateu traz'.split(' '));

 /* ---------- vocabulário permitido: SÓ save + head booker (nunca fala de persona) ---------- */
 function vocab(m,extra){
  const set=new Set(BASE);
  const add=t=>{F(t).split(' ').forEach(x=>{if(x.length>1)set.add(x)})};
  Object.keys(S.roster||{}).forEach(n=>{add(n);add(CN(n));add((S.roster[n]||{}).brand)});
  (typeof TITLES!=='undefined'?TITLES:[]).forEach(t=>add(t[0]+' '+t[1]));
  (S.events||[]).forEach(e=>{add(e.name);(e.matches||[]).forEach(x=>{add(x.stipulation);add(x.championship)})});
  (S.stories||[]).forEach(s=>{add((s.names||[]).join(' '));add(s.text)});
  Object.keys(S.ppvPlans||{}).forEach(add);
  ((m&&m.messages)||[]).filter(x=>x.role==='user').forEach(x=>add(x.text));
  if(m){add(m.target);add(m.openingTopic)}
  add(extra);
  return set;
 }

 /* ---------- nomes próprios que não existem no save ---------- */
 const core=w=>w.replace(/^[("“‘'\[]+|[)"”’'\].,;:!?…]+$/g,'');
 const isCap=c=>/^[A-ZÀ-Ý][\p{L}'’-]*$/u.test(c)&&!(c===c.toUpperCase()&&c.length<=5);
 const unknownTok=(t,V)=>F(t).split(' ').some(x=>x.length>1&&!V.has(x));
 function foreignNames(s,V){
  const w=[...String(s).matchAll(/\S+/g)].map(x=>x[0]),out=[];
  let i=0;
  while(i<w.length){
   const c=core(w[i]);
   if(!isCap(c)){i++;continue}
   const prev=i?w[i-1]:'',start=i===0||/[.!?…:—–]$/.test(prev)||/^[—–-]$/.test(prev);
   const toks=[c];let j=i;
   while(!/[.,;:!?…)]$/.test(w[j])&&j+1<w.length&&isCap(core(w[j+1]))){j++;toks.push(core(w[j]))}
   const next=j+1<w.length?F(w[j+1]):'';
   let test=toks;
   if(start){
    if(toks.length===1)test=STARTNEXT.has(next)?toks:[];      /* palavra comum no início da frase */
    else if(unknownTok(toks[0],V)&&!toks.slice(1).some(t=>unknownTok(t,V)))test=[];  /* "Então Moxley" */
   }
   const unk=test.filter(t=>unknownTok(t,V));
   if(unk.length)out.push(toks.join(' '));
   i=j+1;
  }
  return uniq(out);
 }

 /* ---------- fatos do save ---------- */
 const matches=()=>{const o=[];(S.events||[]).forEach(e=>(e.matches||[]).forEach(mm=>o.push(mm)));return o};
 const shared=(a,b)=>matches().some(mm=>{const p=(mm.participants||[]).map(CN);return p.includes(a)&&p.includes(b)});
 const beat=(a,b)=>matches().some(mm=>!/empate|draw/i.test(String(mm.winner||''))&&plwSides(mm.winner).map(CN).includes(a)&&plwSides(mm.loser).map(CN).includes(b));
 const feudPair=(a,b)=>(S.stories||[]).some(x=>x.type==='rivalry'&&(x.names||[]).map(CN).includes(a)&&(x.names||[]).map(CN).includes(b))||shared(a,b);
 const rejected=m=>{
  try{
   const st=meetingStateEnsure(m)||{};
   return uniq([...(st.excluded||[]).map(x=>x&&x.name||x),...(((st.debate||{}).rejected)||[]).map(x=>x&&x.name||x),...(st.meetingDisliked||[])].filter(Boolean).map(CN));
  }catch(e){return[]}
 };
 const stars=t=>{const s=new Set();let r;const rx=/(\d+(?:[.,]\d+)?)\s*★/g;while((r=rx.exec(t)))s.add(parseFloat(r[1].replace(',','.')));return s};

 /* ---------- bloco SAVE CANON + ELENCO (mesmo universo do modo solo) ---------- */
 function canonBlock(m,key){
  let ctx='';
  try{ctx=String(buildMeetingContext()||'')}catch(e){}
  let save='';
  const i=ctx.indexOf('SAVE CANON');
  if(i>=0){save=ctx.slice(i);const j=save.search(/\n\s*\n|\nLOUSA/);if(j>0)save=save.slice(0,j)}
  const by={};
  uniq(Object.keys(S.roster||{})).forEach(n=>{const b=(S.roster[n]||{}).brand||'?';(by[b]=by[b]||[]).push(CN(n)+(typeof bkOut==='function'&&bkOut(n)?' (indisponível)':''))});
  const roster=cap(Object.keys(by).map(b=>b+': '+uniq(by[b]).join(', ')).join('\n'),2200);
  const role=key==='tony'?'\nCREATIVE ROOM: você pode inventar FUTURO (ângulo, stip, promo, build) usando só lutadores do ELENCO; jamais invente passado.'
   :key==='hal'?'\nANALISTA: cite apenas números escritos acima ou em FATOS VERIFICADOS. Sem número no texto, diga que o save não tem.':'';
  return '=== SAVE CANON (única fonte do passado; o mesmo do modo solo) ===\n'
   +'ELENCO VÁLIDO — estes são os ÚNICOS lutadores que existem. Qualquer outro nome de lutador é inventado e PROIBIDO:\n'+roster+'\n'
   +(save?cap(save,2600)+'\n':'')
   +'REGRAS DE VERDADE:\n'
   +'- Só é fato do passado (luta, resultado, nota ★, empate, campeão, sequência, rivalidade) o que está escrito neste bloco ou em FATOS VERIFICADOS. Se não está, diga que não tem o dado; não estime.\n'
   +'- As falas anteriores das vozes no HISTÓRICO são opinião/proposta, NUNCA evidência do passado. Só decisões e rejeições do HEAD BOOKER são direção.\n'
   +'- Nunca crie lutador, apelido ou personagem novo. Ideias de futuro usam apenas o ELENCO VÁLIDO.'+role;
 }

 /* ---------- auditoria de uma fala ---------- */
 function audit(text){
  const m=S.bookingMeeting||{},plan=window.__mtgPlan||{};
  const facts=String(window.__mtgCanon||'')+'\n'+String(plan.factsTxt||'')+'\n'+String(plan.candTxt||'')+'\n'+String(plan.board||'');
  const V=vocab(m,facts),okStars=stars(facts),rej=rejected(m);
  const keep=[],drop=[];
  for(const s of String(text||'').split(/(?<=[.!?…])\s+/)){
   if(!s.trim())continue;
   const f=F(s);let why='';
   const bad=foreignNames(s,V);
   if(bad.length)why='nome que não existe no roster: '+bad.join(', ');
   if(!why){const b=[...stars(s)].filter(v=>![...okStars].some(x=>Math.abs(x-v)<=0.06));if(b.length)why='nota '+b.join(', ')+'★ que não está no save'}
   if(!why&&/\bempate\b|\bdraw\b/.test(f)&&!/empate|draw/i.test(facts))why='empate que não está no save';
   if(!why){const r=STREAK.exec(s);if(r){const n=r[1]||r[2];const ok=n?new RegExp(n+'[^\\n]{0,25}vit|vit[^\\n]{0,25}'+n,'i').test(facts):/invicto/i.test(facts);if(!ok)why='sequência de vitórias que o save não registra'}}
   const names=uniq(resolveRosterMentions(s).map(CN));
   if(!why&&names.length&&rej.length&&!NEG.test(f)){const h=names.filter(n=>rej.includes(n));if(h.length)why='nome rejeitado pelo head booker: '+h.join(', ')}
   if(!why&&names.length>=2&&PAST.test(f)){
    let ok=false;
    for(let a=0;a<names.length&&!ok;a++)for(let b=a+1;b<names.length&&!ok;b++)if(shared(names[a],names[b]))ok=true;
    const dv=/(.*?)\b(derrotou|venceu|bateu|superou|ganhou de)\b(.*)/i.exec(s),pp=/(.*?)\bperdeu (?:para|de|pra)\b(.*)/i.exec(s);
    if(ok&&(dv||pp)){
     const L=uniq(resolveRosterMentions((dv||pp)[1]).map(CN)),R=uniq(resolveRosterMentions((dv?dv[3]:pp[2])).map(CN));
     if(L.length&&R.length)ok=dv?L.some(a=>R.some(b=>beat(a,b))):L.some(a=>R.some(b=>beat(b,a)));
    }
    if(!ok)why='confronto/resultado passado que o save não registra ('+names.join(' x ')+')';
   }
   if(!why&&names.length>=2&&FEUD.test(f)&&!FUT.test(f)){
    let ok=false;
    for(let a=0;a<names.length&&!ok;a++)for(let b=a+1;b<names.length&&!ok;b++)if(feudPair(names[a],names[b]))ok=true;
    if(!ok)why='rivalidade passada que o save não registra';
   }
   if(why)drop.push({s,why});else keep.push(s);
  }
  return{clean:keep.join(' ').trim(),dropped:drop};
 }
 window.__mtgAudit=audit;   /* para testar no console: __mtgAudit('texto') */

 /* ---------- ganchos (todos por cima da cadeia existente; nada é reescrito) ---------- */
 const _plan=window.buildPlan;
 if(typeof _plan==='function')window.buildPlan=function(){const p=_plan.apply(this,arguments);window.__mtgPlan=p;return p};

 const _prompt=window.buildPrompt;
 if(typeof _prompt==='function')window.buildPrompt=function(key,plan,m,message,round,extra){
  window.__mtgKey=key;if(plan)window.__mtgPlan=plan;
  const c=canonBlock(m||S.bookingMeeting||{},key);
  window.__mtgCanon=c;
  return c+'\n\n'+_prompt.apply(this,arguments);
 };

 const _check=window.checkText;
 if(typeof _check==='function')window.checkText=function(){
  let base=[];
  try{base=_check.apply(this,arguments)||[]}catch(e){}
  try{const a=audit(arguments[0]);if(a.dropped.length)base=base.concat(['Reescreva sem: '+a.dropped.map(d=>d.why).join('; ')+'. Use só lutadores do ELENCO VÁLIDO e fatos do SAVE CANON.'])}catch(e){}
  return base;
 };

 const SAFE='Isso eu não consigo sustentar com o que está no save. Me diz um nome do roster ou por onde você quer seguir.';
 const _fin=window.finalizeText;
 if(typeof _fin==='function')window.finalizeText=function(t){
  let x=t;
  try{
   const a=audit(t);
   if(a.dropped.length){console.warn('[PLW canon-guard] frases removidas:',a.dropped);x=a.clean||SAFE}
  }catch(e){console.error('[PLW canon-guard]',e)}
  return _fin.call(this,x);
 };

 console.log('[PLW] MTG CANON GUARD ativo — SAVE CANON no prompt + auditoria de nomes/fatos');
 }catch(e){console.error('[PLW] MTG CANON GUARD falhou ao iniciar (reunião segue como antes):',e)}
})();
</script>
