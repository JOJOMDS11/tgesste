<script>
/* ===== V22: UMA ÚNICA LOUSA + brand + seletor sem duplicação ===== */
(function(){
  if(window.__PLW_MEETING_V22__) return;
  window.__PLW_MEETING_V22__=true;
  const C=n=>typeof plwCanonicalName==='function'?plwCanonicalName(String(n||'')):String(n||'').trim();
  const E=x=>typeof esc==='function'?esc(String(x??'')):String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function st(m){const s=meetingStateEnsure(m);for(const k of ['meetingTopicCandidates','meetingLiked','meetingDisliked','meetingTurnBlocks'])if(!Array.isArray(s[k]))s[k]=[];return s}
  function focal(m){return C(st(m).open?.focal||'')}
  function brand(n){
    const w=(S.roster||{})[n]||{}; const b=String(w.brand||'').trim();
    if(typeof bkBrandLbl==='function') return bkBrandLbl(n);
    if(b==='MOTION'||b==='PLW MOTION') return 'PLW MOTION';
    if(b==='SHOW OFF'||b==='PLW SHOW OFF') return 'PLW SHOW OFF';
    if(b==='PLWAR') return 'PLWAR';
    return b||'Brand não registrada';
  }
  function occupied(m){
    const out=new Set(),add=n=>{const c=C(n);if(c)out.add(c)};
    try{const p=ppvPlan(nextPPV());for(const mt of (p?.card||[]))for(const n of (mt?.a||[]))add(n)}catch(e){}
    try{const s=st(m);for(const item of [...(s.plannedMatches||[]),...(s.confirmedMatches||[])]){
      if(item?.participants) for(const n of item.participants)add(n);
      else if(item?.text&&typeof resolveRosterMentions==='function') for(const n of resolveRosterMentions(item.text))add(n);
    }}catch(e){}
    return out;
  }
  function rows(m){
    const s=st(m),all=s.meetingTopicCandidates||[],dis=new Set((s.meetingDisliked||[]).map(C)),tmp=new Set((s.meetingTurnBlocks||[]).map(C)),liked=new Set((s.meetingLiked||[]).map(C)),occ=occupied(m);
    return all.map((n,i)=>{
      const c=C(n), isOcc=occ.has(c);
      const status=dis.has(c)?'👎 bloqueado':isOcc?'⛔ ocupado no card':tmp.has(c)?'⏸️ fora nesta rodada':liked.has(c)?'👍 favorito':'⚪ disponível';
      const buttons=dis.has(c)?`<button class="btn s" style="padding:3px 7px" onclick="meetingVoteV18('${E(n)}','restore')">↩️</button>`:`<button class="btn s" style="padding:3px 7px" onclick="meetingVoteV18('${E(n)}','like')">👍</button><button class="btn r" style="padding:3px 7px" onclick="meetingVoteV18('${E(n)}','dislike')">👎</button>`;
      return `<div class="row" style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);gap:8px"><div style="flex:1"><b>${i+1}.</b> ${E(n)} <span class="tag" style="--c:${E(typeof bc==='function'?bc(brand(n)):'#6a0dad')};margin-left:5px">${E(brand(n))}</span> <span class="mut">${status}</span></div><div>${buttons}</div></div>`;
    }).join('');
  }
  function findMatchingDiv(html,start){
    const openRe=/<div\b/gi, closeRe=/<\/div>/gi; let depth=0,pos=start;
    while(true){
      openRe.lastIndex=pos; closeRe.lastIndex=pos;
      const o=openRe.exec(html), c=closeRe.exec(html);
      if(!o && !c) return -1;
      if(o && (!c || o.index<c.index)){depth++;pos=o.index+4;if(depth===0){} continue;}
      depth--;pos=c.index+c[0].length;if(depth===0)return pos;
    }
  }
  function boardHtml(m){
    const s=st(m),f=focal(m),r=rows(m);
    if(!f&&!s.meetingTopicCandidates.length)return '';
    return `<div id="meeting-frozen-board" class="card" style="--c:#6a0dad;margin-top:10px"><b>🧠 LOUSA CONGELADA — ${E(f?'adversário de '+f:'tópico da reunião')}</b><div class="mut" style="margin:5px 0 8px">Os candidatos abaixo não são recalculados a cada fala. Você decide 👍 ou 👎. A conversa só trabalha com o que continua disponível.</div>${r||'<div class="mut">Nenhum candidato calculado no save para este assunto.</div>'}</div>`;
  }
  function selectorHtml(m){
    const s=st(m),f=focal(m),occ=occupied(m),existing=new Set((s.meetingTopicCandidates||[]).map(C)),blocked=new Set([...(s.meetingDisliked||[]),...(s.meetingTurnBlocks||[])].map(C));
    const groups={'PLWAR':[],'PLW MOTION':[],'PLW SHOW OFF':[],'PLW':[]};
    Object.keys(S.roster||{}).sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(n=>{
      const c=C(n); if(!c||c===f||occ.has(c)||blocked.has(c)||existing.has(c))return;
      const b=brand(n); (groups[b]||groups.PLW).push(n);
    });
    const order=['PLWAR','PLW MOTION','PLW SHOW OFF','PLW'];
    const opts=order.map(g=>groups[g].length?`<optgroup label="${E(g)}">${groups[g].map(n=>`<option value="${E(n)}">${E(n)} — ${E(brand(n))}</option>`).join('')}</optgroup>`:'').join('');
    return `<div id="meeting-candidate-adder" class="card" style="--c:#6a0dad;margin-top:8px"><b>➕ Adicionar candidato à lousa</b><div class="mut" style="margin:4px 0 7px">Escolha um nome do roster. A lista mostra a brand e não recalcula os candidatos já congelados.</div><div class="row"><select id="meeting-v20-candidate" style="flex:1"><option value="">Escolha um lutador...</option>${opts}</select><button class="btn s" onclick="meetingAddCandidateV22()">Adicionar</button></div></div>`;
  }
  window.meetingAddCandidateV22=function(){
    const m=S.bookingMeeting;if(!m)return;const input=document.getElementById('meeting-v20-candidate'),n=C(input?.value||'');if(!n)return toast('Escolha um lutador.');
    const s=st(m),f=focal(m),occ=occupied(m); if(n===f)return toast('O alvo da discussão não pode ser candidato.'); if(occ.has(n))return toast(n+' já está no card.');
    if((s.meetingDisliked||[]).some(x=>C(x)===n)||(s.meetingTurnBlocks||[]).some(x=>C(x)===n))return toast(n+' está fora desta discussão.');
    if(!(s.meetingTopicCandidates||[]).some(x=>C(x)===n))s.meetingTopicCandidates.push(n); persist(); render();
  };
  const oldV=window.vMeeting;
  window.vMeeting=function(){
    const m=S.bookingMeeting;if(!m)return oldV();const s=st(m),h=oldV();
    // O v18/v20 já inserem elementos. Aqui removemos TODA ocorrência anterior da lousa e do adicionador,
    // inclusive o resto do card antigo, e inserimos exatamente uma versão final.
    let out=h;
    const marker='🧠 LOUSA CONGELADA';
    while(true){
      const p=out.indexOf(marker); if(p<0)break;
      const start=out.lastIndexOf('<div',p); if(start<0)break;
      const end=findMatchingDiv(out,start); if(end<0)break;
      out=out.slice(0,start)+out.slice(end);
    }
    // Remove qualquer adder antigo deixado por versões anteriores.
    while(true){
      const p=out.indexOf('id="meeting-candidate-adder"'); if(p<0)break;
      const start=out.lastIndexOf('<div',p); if(start<0)break;
      const end=findMatchingDiv(out,start); if(end<0)break;
      out=out.slice(0,start)+out.slice(end);
    }
    const textarea='<textarea id="meeting-input"';
    const pos=out.indexOf(textarea); if(pos<0)return out;
    const endTa=out.indexOf('</textarea>',pos); if(endTa<0)return out;
    const at=endTa+'</textarea>'.length;
    return out.slice(0,at)+boardHtml(m)+selectorHtml(m)+out.slice(at);
  };
})();
</script>

<!-- V23: REUNIÃO ESPERTA — rejeição real, mais nomes da brand, vozes independentes -->
<script>
(function(){
  if(window.__PLW_MEETING_V23__) return;
  window.__PLW_MEETING_V23__=true;

  const C=n=>typeof plwCanonicalName==='function'?plwCanonicalName(String(n||'')):String(n||'').trim();
  const F=x=>typeof plwFold==='function'?plwFold(String(x||'')):String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];
  const brandOf=n=>{
    if(typeof bkBrandLbl==='function') return bkBrandLbl(n);
    const b=String(((S.roster||{})[n]||{}).brand||'').toUpperCase();
    if(b.includes('MOTION')) return 'PLW MOTION';
    if(b.includes('SHOW')) return 'PLW SHOW OFF';
    if(b.includes('WAR')) return 'PLWAR';
    return 'PLW';
  };
  const brandKey=b=>{
    const x=String(b||'').toUpperCase();
    if(x.includes('MOTION')) return 'MOTION';
    if(x.includes('SHOW')) return 'SHOW OFF';
    if(x.includes('WAR')||x==='PLWAR') return 'PLWAR';
    return '';
  };

  function st(m){
    const s=meetingStateEnsure(m);
    for(const k of ['meetingTopicCandidates','meetingLiked','meetingDisliked','meetingTurnBlocks','excluded','booked','cardPairs','lastShortlist'])
      if(!Array.isArray(s[k])) s[k]=[];
    if(!s.brandReq||typeof s.brandReq!=='object') s.brandReq={};
    if(!s.open) s.open=null;
    return s;
  }
  function focal(m){return C(st(m).open?.focal||'')}

  /* ---- parsing mais agressivo da fala do head booker ---- */
  function parseUserIntentV23(m, text){
    const s=st(m), src=String(text||''), f=F(src);
    const names=uniq((typeof resolveRosterMentions==='function'?resolveRosterMentions(src):[]).map(C));
    let changed=false;

    // "não pode ser X", "X não dá", "sem X", "tira X", "X fora"
    const negPatterns=[
      /\bnao pode (ser|ser o|ser a)\b/i,
      /\bnao (da|dá|serve|quero|gosto|cabe|entra)\b/i,
      /\b(tira|tire|descarta|esquece|fora)\b/i,
      /\bsem (o |a )?/i,
      /\bvetad/i,
      /\bnao e (o |a )?(momento|hora)\b/i,
      /\bagora nao\b/i
    ];
    for(const n of names){
      // se o nome aparece perto de negação
      const idx=f.indexOf(F(n));
      if(idx<0) continue;
      const window=f.slice(Math.max(0,idx-40), idx+F(n).length+40);
      if(negPatterns.some(rx=>rx.test(window)) || /\bnao\b/.test(window) && /\b(pode|quero|gosto|da|serve|cabe)\b/.test(window)){
        if(!s.excluded.some(x=>C(x.name)===n)){s.excluded.push({name:n,why:'head booker rejeitou'});changed=true}
        if(!s.meetingDisliked.includes(n)){s.meetingDisliked.push(n);changed=true}
        s.meetingLiked=s.meetingLiked.filter(x=>C(x)!==n);
        s.meetingTopicCandidates=s.meetingTopicCandidates.filter(x=>C(x)!==n);
      }
    }

    // "só X e Y me agradam / gosto / quero" → like esses, dislike o resto da lista atual
    if(/\b(so|só|apenas|somente)\b/.test(f) && /\b(agrada|gosto|quero|prefiro|curto|bom|ok)\b/.test(f) && names.length){
      for(const n of names){
        if(!s.meetingLiked.includes(n)) s.meetingLiked.push(n);
        s.meetingDisliked=s.meetingDisliked.filter(x=>C(x)!==n);
        if(!s.meetingTopicCandidates.some(x=>C(x)===n)) s.meetingTopicCandidates.push(n);
      }
      const keep=new Set(names.map(C));
      for(const c of [...s.meetingTopicCandidates]){
        if(!keep.has(C(c)) && !s.meetingDisliked.includes(c)){
          s.meetingDisliked.push(c);
          if(!s.excluded.some(x=>C(x.name)===C(c))) s.excluded.push({name:c,why:'head booker preferiu outros'});
        }
      }
      changed=true;
    }

    // pedido de MAIS nomes / OUTROS nomes / da BRAND
    const wantsMore=/\b(mais|outro|outros|outra|outras|novos?|novas?|alternativ|diferente|alem|além)\b/.test(f) &&
      /\b(nome|nomes|lutador|lutadores|candidato|oponente|adversario|desafiante|rival)\b/.test(f);
    const brandAsk=/\b(da|do|de|na|no)\s+(plwar|plw\s*ar|plw\s*motion|motion|plw\s*show\s*off|show\s*off)\b/.exec(f)
      || /\b(plwar|plw\s*motion|motion|plw\s*show\s*off|show\s*off)\b/.exec(f);
    let brandWanted='';
    if(brandAsk){
      const raw=brandAsk[brandAsk.length-1]||brandAsk[0];
      brandWanted=brandKey(raw);
    }
    // "nomes da PLWAR" mesmo sem "mais"
    if(!brandWanted && /\bplwar\b/.test(f) && /\b(nome|nomes|lutador|candidato)\b/.test(f)) brandWanted='PLWAR';

    if(brandWanted && s.open && s.open.focal){
      s.brandReq[s.open.focal]=brandWanted;
      changed=true;
    }

    // "não pode ser Adam Page" etc. já coberto; garantir open mantido
    if(s.open && s.open.focal && (wantsMore || brandWanted || /\b(contra quem|quem (deve|vai|pode)|desafiante|oponente)\b/.test(f))){
      s.turn={intent:'opponent',text:src,pair:null,check:'',changed:true,wantsMore:!!wantsMore,brandWanted};
    } else if(changed){
      s.turn=Object.assign({},s.turn||{},{text:src,changed:true,wantsMore:!!wantsMore,brandWanted});
    }

    if(changed||wantsMore||brandWanted) persist();
    return {wantsMore:!!wantsMore, brandWanted, names, changed};
  }

  /* ---- candidatos expandidos: respeita brand + exclusões + pede mais ---- */
  window.expandCandidatesV23=function(m, F, brandWanted, limit){
    limit=limit||8;
    const s=st(m);
    const blocked=new Set([
      ...s.excluded.map(x=>C(x.name)),
      ...s.meetingDisliked.map(C),
      ...s.meetingTurnBlocks.map(C),
      ...(s.booked||[]).flatMap(b=>(b.names||[]).map(C)),
      ...(s.cardPairs||[]).flatMap(c=>(c.names||[]).map(C))
    ]);
    // ocupados no card do PPV
    try{
      const n=String(m.target||'').split(' — ')[0].trim();
      if(n && typeof ppvPlan==='function'){
        const P=ppvPlan(n);
        for(const mt of (P?.card||[])) for(const x of (mt?.a||[])) blocked.add(C(x));
      }
    }catch(e){}
    blocked.add(C(F));

    const req=brandWanted || s.brandReq[F] || '';
    const reqKey=brandKey(req);

    let pool=Object.keys(S.roster||{}).map(C).filter(n=>{
      if(!n||blocked.has(n)) return false;
      const w=S.roster[n]||{};
      if(w.inj||w.status==='lesionado'||w.susp||w.status==='suspenso') return false;
      if(reqKey){
        // brand check via brandOf
        const bkey=brandKey(brandOf(n));
        if(bkey!==reqKey) return false;
      }
      return true;
    });

    // score simples por forma recente
    const scored=pool.map(n=>{
      let score=0, plain='sem lutas recentes';
      try{
        if(typeof form==='function'){
          const f=form(n,3);
          score=(f.avg||0)+0.3*(f.w||0);
          plain=f.n?(f.w+'V nas últimas '+f.n+(f.avg!=null?', média '+Number(f.avg).toFixed(2)+'★':'')):'sem lutas registradas';
        }
      }catch(e){}
      // boost se já está na lista liked
      if((s.meetingLiked||[]).map(C).includes(n)) score+=50;
      return {name:n, brand:brandOf(n), score, plain, reason:n+' ['+brandOf(n)+'] — '+plain};
    });
    scored.sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'pt-BR'));
    return scored.slice(0,limit);
  }

  /* ---- sobrescreve candidates() quando há brandReq ou wantsMore ---- */
  const _origCandidates=window.candidates;
  window.candidates=function(m,F){
    const s=st(m);
    const brandWanted=s.brandReq[F]||'';
    const turn=s.turn||{};
    // se lista congelada ativa e não pediu mais, filtra pelos ativos
    if(Array.isArray(s.meetingTopicCandidates) && s.meetingTopicCandidates.length && !turn.wantsMore){
      const act=new Set(s.meetingTopicCandidates.map(C).filter(n=>
        !s.meetingDisliked.map(C).includes(n) &&
        !s.meetingTurnBlocks.map(C).includes(n) &&
        !s.excluded.some(x=>C(x.name)===n)
      ));
      let raw=[];
      try{raw=(_origCandidates?_origCandidates.call(this,m,F):[])||[]}catch(e){raw=[]}
      let filtered=raw.filter(x=>act.has(C(x.name)));
      // se a lista ativa ficou vazia ou muito curta e user pediu brand, expande
      if(filtered.length<2 && brandWanted){
        const exp=expandCandidatesV23(m,F,brandWanted,8);
        return exp;
      }
      // boost liked
      filtered=filtered.map(x=>{
        const y=Object.assign({},x);
        if((s.meetingLiked||[]).map(C).includes(C(y.name))) y.score=(y.score||0)+999;
        return y;
      }).sort((a,b)=>(b.score||0)-(a.score||0));
      return filtered;
    }
    // pedido explícito de mais nomes ou brand
    if(turn.wantsMore || brandWanted){
      return expandCandidatesV23(m,F,brandWanted,8);
    }
    try{return _origCandidates?_origCandidates.call(this,m,F):[]}catch(e){return expandCandidatesV23(m,F,brandWanted,5)}
  };

  /* ---- fallback forte: sempre entrega nome novo ---- */
  const _origFallback=typeof fallbackText==='function'?fallbackText:null;
  window.fallbackText=function(key,plan,m,round){
    const s=st(m), F=plan.F||focal(m);
    let cands=plan.cands||[];
    if((!cands||!cands.length) && F){
      cands=expandCandidatesV23(m,F,s.brandReq[F]||plan.brandWanted||'',6);
    }
    // tira nomes já citados na rodada
    const used=new Set((round?.said||[]).flatMap(t=>{
      try{return resolveRosterMentions(t).map(C)}catch(e){return[]}
    }));
    if(round?.pick) used.add(C(round.pick));
    const fresh=cands.filter(c=>!used.has(C(c.name)));
    const pick=(fresh[0]||cands[0]);
    const pick2=fresh[1]||cands[1];

    if(plan.intent==='opponent'||plan.intent==='correction'||(s.turn&&s.turn.wantsMore)){
      if(!pick){
        if(key==='tony') return 'Não sobrou nome livre nessa brand no save. Eu mudaria a estrutura: Triple Threat ou Fatal 4-Way com quem ainda estiver disponível, ou abriria a brand.';
        if(key==='hal') return 'No save não restou candidato válido com a brand e os bloqueios atuais. Ou liberamos alguém ou mudamos a estrutura da luta.';
        return 'Com os bloqueios atuais não sobrou nome. Me diz se posso abrir outra brand ou se soltamos alguém da lista.';
      }
      if(key==='jj'){
        if(pick2 && (s.turn&&s.turn.wantsMore)) return 'Eu iria de '+pick.name+' ('+pick.plain+'). Como segundo nome, '+pick2.name+' também segura: '+pick2.plain+'.';
        return 'Pra mim o caminho é '+pick.name+': '+pick.plain+'. Timing e brand batem.';
      }
      if(key==='hal'){
        // discorda se J.J. já pegou o top
        if(round?.pick && C(round.pick)===C(pick.name) && pick2){
          return 'Os números de '+pick.name+' são bons, mas eu olharia '+pick2.name+': '+pick2.plain+'. Menos óbvio e ainda sustenta o nível.';
        }
        return 'Pelos números, '+pick.name+' faz sentido: '+pick.plain+'.';
      }
      // tony — ideia de construção
      return 'Com '+pick.name+', eu construiria 3 semanas de tensão antes do PPV — um encontro no ringue, uma provocação e um confronto físico na semana do show. '+(pick2?'Se a sala quiser alternativa, '+pick2.name+' abre um ângulo mais técnico.':'');
    }
    if(_origFallback) try{return _origFallback(key,plan,m,round)}catch(e){}
    return key==='jj'?'Me dá um nome ou uma direção que eu monto o caminho.':key==='hal'?'Sem dado novo no save pra isso; cita o nome que eu confiro.':'Me fala o eixo e eu levanto o que abre.';
  };

  /* ---- prompts: 3 pessoas diferentes, podem discordar ---- */
  const PERSONA_EDGE={
    jj:'Você é J.J. Purple, booker parceiro. Tem opinião própria e NÃO precisa agradar. Se a ideia do head booker for fraca, diga e proponha outra. Escolha UM nome da lista de candidatos ativos e defenda com timing/momentum/proteção. Se outro já escolheu o mesmo, você pode manter OU trocar se tiver motivo real — não copie a justificativa.',
    hal:'Você é o Analista. Sua lealdade é aos números do SAVE, não ao consenso da sala. Se os dados sustentam a escolha do J.J., diga que concorda e acrescente UM número concreto. Se os dados apontam outro candidato da lista, DEFENDA o outro com o número — discordo é saudável. Nunca invente nota. Nunca proponha segmento/promo.',
    tony:'Você é a Creative Room. Pensa em ângulo, estipulação e o que a luta ABRE nas próximas semanas. Pode concordar com um nome e desenvolver a história, OU discordar e oferecer estrutura diferente (Triple Threat, título em jogo, stip). Uma ideia só, concreta. Não repita a fala do J.J. nem do Analista.'
  };

  const _origBuildPrompt=typeof buildPrompt==='function'?buildPrompt:null;
  if(_origBuildPrompt){
    window.buildPrompt=function(key,plan,m,message,round,extra){
      let base=_origBuildPrompt(key,plan,m,message,round,extra);
      const edge=PERSONA_EDGE[key]||'';
      const s=st(m);
      const active=uniq((plan.cands||[]).map(c=>c.name));
      const blocked=uniq([...(s.meetingDisliked||[]),...(s.excluded||[]).map(x=>x.name)]);

<!-- V24: nomes clicáveis, X no mini-card, veto não trava a conversa -->
<script>
(function(){
  if(window.__PLW_MEETING_V24__) return;
  window.__PLW_MEETING_V24__=true;
  const C=n=>typeof plwCanonicalName==='function'?plwCanonicalName(String(n||'')):String(n||'').trim();
  const Fold=x=>typeof plwFold==='function'?plwFold(String(x||'')):String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  const uniq=a=>[...new Set((a||[]).filter(Boolean))];
  function st(m){
    const s=meetingStateEnsure(m);
    for(const k of ['meetingTopicCandidates','meetingLiked','meetingDisliked','meetingTurnBlocks','excluded','booked','cardPairs','lastShortlist','removedMatches','blockedNames'])
      if(!Array.isArray(s[k])) s[k]=[];
    if(!s.brandReq||typeof s.brandReq!=='object') s.brandReq={};
    return s;
  }
  function namesOf(text){
    try{return uniq(resolveRosterMentions(String(text||'')).map(C))}catch(e){return[]}
  }
  function wantsNames(f){
    return /\b(\d+\s+nomes?|mais\s+\d*\s*nomes?|outros?\s+nomes?|novos?\s+nomes?|quero\s+(mais\s+)?(\d+\s+)?nomes?|me\s+(da|de)\s+(\d+\s+)?nomes?|sugira\s+(\d+\s+)?nomes?|dois nomes|tres nomes|2 nomes|3 nomes)\b/.test(f)
      || (/\bnome(s)?\b/.test(f) && /\b(quero|preciso|sugir|mais|outro|alternativ)\b/.test(f));
  }
  function isVetoTalk(f){
    return /\b(vetamos|vetar|vetado|vetad|nao da|nao pode|tira |tire |fora|nao quero|nao gosto|esquece|descarta)\b/.test(f);
  }
  function wantsBuild(f){
    return /\b(nao precisa ter historico|sem historico|nao precisa (de )?historico|3 semanas|tres semanas|buildar|build |construir a feud|desenvolver a feud)\b/.test(f);
  }

  /* ---- chat privado: nomes clicáveis como na reunião ---- */
  const _vChat=window.vChat;
  window.vChat=function(key,title,hint){
    let h=_vChat?_vChat(key,title,hint):'';
    const list=chats[key]||[];
    list.forEach(x=>{
      if(!x||!x.t) return;
      const plain=esc(x.t);
      if(h.includes(plain) && typeof pressLinkify==='function'){
        h=h.replace(plain, pressLinkify(x.t));
      }
    });
    return h;
  };

  /* ---- analyze: "vetamos X, quero 2 nomes" NÃO é check ---- */
  const _analyze=window.analyze;
  if(typeof _analyze==='function'){
    window.analyze=function(m,text){
      const t=_analyze(m,text)||{};
      const s=st(m), f=Fold(text);
      if(wantsBuild(f)) s.allowNoHistory=true;
      const vetoed=namesOf(text);
      if(isVetoTalk(f)){
        for(const n of vetoed){
          if(s.open&&C(s.open.focal)===n) continue;
          if(!s.excluded.some(x=>C(x.name)===n)) s.excluded.push({name:n,why:'vetado'});
          if(!s.meetingDisliked.map(C).includes(n)) s.meetingDisliked.push(n);
          s.meetingTopicCandidates=s.meetingTopicCandidates.filter(x=>C(x)!==n);
        }
      }
      if(s.open&&s.open.focal && (wantsNames(f) || (isVetoTalk(f)&&wantsNames(f)) || (t.intent==='check'&&(wantsNames(f)||isVetoTalk(f))))){
        t.intent='opponent';
        t.check='';
        t.wantsMore=true;
        t.pair=null;
        s.turn=Object.assign({},s.turn||{},t,{intent:'opponent',check:'',wantsMore:true,text:String(text||'')});
      }
      persist();
      return t;
    };
  }

  /* ---- candidatos: se pediu nomes / sem histórico, abre o pool ---- */
  const _cands=window.candidates;
  window.candidates=function(m,F){
    const s=st(m);
    let raw=[];
    try{raw=(_cands?_cands.call(this,m,F):[])||[]}catch(e){raw=[]}
    if(s.allowNoHistory || (s.turn&&s.turn.wantsMore) || (typeof expandCandidatesV23==='function')){
      let extra=[];
      try{
        if(typeof expandCandidatesV23==='function') extra=expandCandidatesV23(m,F,s.brandReq[F]||'',12)||[];
      }catch(e){}
      const seen=new Set(raw.map(x=>C(x.name)));
      extra.forEach(x=>{if(!seen.has(C(x.name))){raw.push(x);seen.add(C(x.name))}});
    }
    const blocked=new Set([
      ...s.excluded.map(x=>C(x.name)),
      ...s.meetingDisliked.map(C),
      ...s.meetingTurnBlocks.map(C)
    ]);
    raw=raw.filter(x=>!blocked.has(C(x.name)));
    return raw.slice(0,10);
  };

  /* ---- fallback: NUNCA responder só o veto; entrega 2 nomes ---- */
  const _fb=window.fallbackText;
  window.fallbackText=function(key,plan,m,round){
    const s=st(m);
    const f=Fold((plan&&plan.text)||'');
    if(plan && (plan.intent==='check') && (isVetoTalk(f)||wantsNames(f)||(plan.check&&s.excluded.some(x=>C(x.name)===C(plan.check))))){
      plan=Object.assign({},plan,{intent:'opponent',check:''});
    }
    const F=plan.F||(s.open&&s.open.focal)||'';
    let cands=plan.cands||[];
    if((!cands||cands.length<2) && F && typeof expandCandidatesV23==='function'){
      try{cands=expandCandidatesV23(m,F,s.brandReq[F]||'',8)||cands}catch(e){}
    }
    const used=new Set((round&&round.said||[]).flatMap(t=>{try{return namesOf(t)}catch(e){return[]}}));
    const fresh=cands.filter(c=>!used.has(C(c.name)));
    const a=fresh[0]||cands[0], b=fresh[1]||cands[1];
    if(plan.intent==='opponent'||plan.intent==='correction'||(s.turn&&s.turn.wantsMore)||wantsNames(f)){
      if(!a){
        if(key==='tony') return 'A lista dessa brand está estreita. Eu mudaria a estrutura: Triple Threat ou abrir a brand.';
        if(key==='hal') return 'Não restou candidato válido no save com os bloqueios atuais.';
        return 'Não sobrou nome livre. Me diz se posso abrir outra brand.';
      }
      if(key==='jj') return b?'Eu iria de '+a.name+' e, de segundo nome, '+b.name+'. Dá pra construir nas próximas semanas mesmo sem histórico direto.':'Eu iria de '+a.name+'.';
      if(key==='hal') return b?'Se o caminho é nome novo, '+a.name+' e '+b.name+' são os que ainda estão livres.':'Pelos números livres, '+a.name+'.';
      return b?'Com '+a.name+' ou '+b.name+' eu construiria 3 semanas: um encontro, uma provocação e o choque na semana do PPV.':'Com '+a.name+' dá pra construir a feud em 3 semanas.';
    }
    try{return _fb?_fb(key,plan,m,round):'Me dá um nome.'}catch(e){return 'Me dá um nome.'}
  };

  /* ---- runV3: veto + pedido de nomes = opponent, e não short-circuit de check ---- */
  const _run=window.runV3;
  if(typeof _run==='function'){
    window.runV3=async function(phase,userText){
      const m=S.bookingMeeting;
      if(m && userText){
        const s=st(m), f=Fold(userText);
        if(wantsBuild(f)) s.allowNoHistory=true;
        if(isVetoTalk(f)){
          for(const n of namesOf(userText)){
            if(s.open&&C(s.open.focal)===n) continue;
            if(!s.excluded.some(x=>C(x.name)===n)) s.excluded.push({name:n,why:'vetado'});
            if(!s.meetingDisliked.map(C).includes(n)) s.meetingDisliked.push(n);
            s.meetingTopicCandidates=s.meetingTopicCandidates.filter(x=>C(x)!==n);
          }
        }
        if(s.open&&s.open.focal && (wantsNames(f)||isVetoTalk(f))){
          s.turn=Object.assign({},s.turn||{},{intent:'opponent',check:'',wantsMore:true,text:userText});
          if(typeof expandCandidatesV23==='function'){
            const exp=expandCandidatesV23(m,s.open.focal,s.brandReq[s.open.focal]||'',12);
            for(const c of exp){
              if(!s.meetingTopicCandidates.some(x=>C(x)===C(c.name)) && !s.meetingDisliked.map(C).includes(C(c.name)))
                s.meetingTopicCandidates.push(c.name);
            }
          }
          persist();
        }
      }
      const origAnalyze=window.analyze;
      // impede o short-circuit de check no runV3 original: se o check é um vetado, vira opponent
      const _sst=window.sst;
      if(typeof _sst==='function' && m){
        const s=st(m);
        if(s.turn && s.turn.intent==='check'){
          const chk=C(s.turn.check||'');
          if(!chk || s.excluded.some(x=>C(x.name)===chk) || wantsNames(Fold(userText||''))){
            s.turn.intent='opponent'; s.turn.check=''; s.turn.wantsMore=true;
          }
        }
      }
      return _run.apply(this,arguments);
    };
  }

  /* ---- prompt: não falar do veto, continuar a pergunta ---- */
  const _bp=window.buildPrompt;
  if(typeof _bp==='function'){
    window.buildPrompt=function(key,plan,m,message,round,extra){
      const add='\n\n# REGRA V24 — VETO NÃO É O ASSUNTO\nSe o head booker vetou alguém, NÃO explique o veto, NÃO diga "não dá agora", NÃO cite o vetado. Responda a pergunta (ex.: dê 2 nomes novos da lista de CANDIDATOS ATIVOS). Silêncio sobre o nome rejeitado. 2 a 4 frases.';
      return _bp(key,plan,m,message,round,extra)+add;
    };
  }

  /* ---- mini-card: X em TODA luta, e a exclusão permanece ---- */
  const _miniDel=window.meetingMiniDeleteV8;
  window.meetingMiniDeleteV8=function(k){
    const m=S.bookingMeeting; if(!m||m.confirmedAt) return;
    const s=st(m);
    const keyOf=ns=>(ns||[]).filter(Boolean).map(C).sort().join('|');
    if(!s.removedMatches.includes(k)) s.removedMatches.push(k);
    s.cardMatches=(s.cardMatches||[]).filter(x=>x.key!==k && keyOf(x.names)!==k);
    s.cardPairs=(s.cardPairs||[]).filter(x=>keyOf(x.names)!==k);
    s.booked=(s.booked||[]).filter(x=>keyOf(x.names)!==k);
    try{
      const n=String(m.target||'').split(' — ')[0].trim();
      if(n && typeof ppvPlan==='function'){
        const P=ppvPlan(n);
        P.card=(P.card||[]).filter(x=>keyOf((x.a||[]).filter(Boolean))!==k);
      }
    }catch(e){}
    persist(); render();
  };

  /* ---- UI da reunião: nomes clicáveis + 1 botão só ---- */
  const _v=window.vMeeting;
  window.vMeeting=function(){
    let h=_v?_v():'';
    const m=S.bookingMeeting; if(!m) return h;

    (m.messages||[]).forEach(x=>{
      if(!x||!x.text||x.text==='…') return;
      const plain=esc(x.text);
      if(typeof pressLinkify==='function' && h.includes(plain)){
        h=h.split(plain).join(pressLinkify(x.text));

      const one=m0.match(/<div class="row"><button class="btn s" onclick="meetingSaveIdea\(\d+\)">[\s\S]*?<\/button><\/div>/);

})();

/* ===== PLW V26c — layout reunião: fala → input → lousa (com brand) → resto; plano no fim ===== */
(function(){
  function mState(m){

    if(!Array.isArray(s.meetingTopicCandidates))s.meetingTopicCandidates=[];
    if(!Array.isArray(s.meetingLiked))s.meetingLiked=[];
    if(!Array.isArray(s.meetingDisliked))s.meetingDisliked=[];
    if(!Array.isArray(s.meetingTurnBlocks))s.meetingTurnBlocks=[];

    if(u.includes('MOTION')) return 'PLW MOTION';
    if(u.includes('SHOW')) return 'PLW SHOW OFF';
    if(u.includes('WAR')) return 'PLWAR';

    const prev=s.meetingTopicCandidates||[];
    s.meetingTopicCandidates=[...new Set([...list.map(can),...prev.map(can)].filter(Boolean))];

  function buildLousaCard(m){
    const s=mState(m);
    const F=(s.open&&s.open.focal)||'';
    let all=s.meetingTopicCandidates||[];
    if(!all.length){

      +(rows||'<div class="mut">Nenhum candidato. Use Atualizar ou Adicionar.</div>')
      +`</div>`;
  }

  function extractBlock(html, startNeedle, idHint){
    /* pega card que começa com startNeedle até o fechamento balanceado do div.card */
    const i=html.indexOf(startNeedle);
    if(i<0) return {html, block:''};
    /* volta até <div class="card" ou <div id= */
    let start=html.lastIndexOf('<div', i);
    if(start<0) start=i;
    let depth=0, pos=start, end=-1;
    while(pos < html.length){
      const open=html.indexOf('<div', pos);
      const close=html.indexOf('</div>', pos);
      if(close<0) break;
      if(open>=0 && open<close){ depth++; pos=open+4; continue; }
      depth--; pos=close+6;
      if(depth===0){ end=pos; break; }
    }
    if(end<0) return {html, block:''};
    return {html: html.slice(0,start)+html.slice(end), block: html.slice(start,end)};
  }

  const _v=window.vMeeting;
  window.vMeeting=function(){
    let h=_v?_v():'';
    const m=S.bookingMeeting;
    if(!m) return h;
    if(m.lousaOpen===undefined||m.lousaOpen===null) m.lousaOpen=true;
    const open=!!m.lousaOpen;

    /* ---- strip listas/lousas/finalizar antigas e duplicadas ---- */
    // frozen board
    while(h.includes('id="meeting-frozen-board"') || h.includes('🧠 LOUSA CONGELADA') || h.includes('id="meeting-lousa-live"')){
      let cut=false;
      for(const needle of ['id="meeting-frozen-board"','🧠 LOUSA CONGELADA','id="meeting-lousa-live"','🧠 LOUSA —','🧠 LOUSA</b>']){
        if(!h.includes(needle) && needle!=='🧠 LOUSA</b>') continue;
        const r=extractBlock(h, needle.includes('id=')?needle:needle);
        if(r.block){ h=r.html; cut=true; }
      }
      if(!cut) break;
    }
    // lista numerada solta estilo "1. Nome PLWAR ⚪" (fallback visual antigo)
    h=h.replace(/(?:<div class="row"[^>]*>\s*)?(?:<div[^>]*>)?\s*\d+\.\s+[A-Za-zÀ-ÿ][^<]{0,40}\s+(?:PLWAR|PLW MOTION|PLW SHOW OFF|MOTION|SHOW OFF)\s*(?:⚪|👍|👎|disponível|bloqueado)[\s\S]*?👎[\s\S]*?(?:<\/div>\s*){1,3}/g,'');
    // Finalizar assunto no meio
    h=h.replace(/<button[^>]*onclick="meetingFinishTopicV18\(\)"[^>]*>[\s\S]*?<\/button>/g,'');
    h=h.replace(/<div class="row"[^>]*>\s*<button class="btn g"[^>]*>🟢 Finalizar assunto[\s\S]*?<\/div>/g,'');
    // controles/adder duplicados
    h=h.replace(/<div class="row" id="meeting-lousa-controls"[\s\S]*?<\/div>/g,'');
    h=h.replace(/<div id="meeting-send-box"[\s\S]*?<\/div>/g,'');

    /* extrai Adicionar candidato */
    let adder='';
    if(h.includes('id="meeting-candidate-adder"') || h.includes('➕ Adicionar candidato')){
      const needle=h.includes('id="meeting-candidate-adder"')?'id="meeting-candidate-adder"':'➕ Adicionar candidato';
      const r=extractBlock(h, needle);
      if(r.block){ adder=r.block; h=r.html; }
    }

    /* extrai MINI-CARD */
    let mini='';
    if(h.includes('MINI-CARD') || h.includes('📋 MINI-CARD')){
      const r=extractBlock(h, h.includes('📋 MINI-CARD')?'📋 MINI-CARD':'MINI-CARD');
      if(r.block){ mini=r.block; h=r.html; }
    }

    /* extrai Criar Card / memória do card */
    let cardTools='';
    for(const needle of ['Abrir Criar Card','Atualizar memória do card','Gravar luta']){
      if(h.includes(needle) && !cardTools){
        const r=extractBlock(h, needle);
        if(r.block){ cardTools+=r.block; h=r.html; }
      }
    }

    /* extrai PLANO E DECISÕES e tudo depois do sec */
    let plano='';
    const planoIdx=h.search(/<div class="sec">\s*📋?\s*PLANO E DECIS/);
    if(planoIdx>=0){
      plano=h.slice(planoIdx);
      h=h.slice(0,planoIdx);
    } else {
      const p2=h.search(/PLANO E DECIS/);
      if(p2>=0){
        const back=h.lastIndexOf('<div', p2);
        if(back>=0){ plano=h.slice(back); h=h.slice(0,back); }
      }
    }

    /* extrai input de mensagem */
    let sendBlock='';
    const ta=h.match(/<textarea id="meeting-input"[\s\S]*?<\/textarea>/);
    const btn=h.match(/<button[^>]*onclick="sendMeetingMessage\(\)"[^>]*>[\s\S]*?<\/button>/);
    if(ta){
      h=h.replace(/<div class="card">\s*<textarea id="meeting-input"[\s\S]*?<\/textarea>\s*(?:<button[^>]*onclick="sendMeetingMessage\(\)"[^>]*>[\s\S]*?<\/button>\s*)?<\/div>/,'');
      if(h.includes(ta[0])) h=h.replace(ta[0],'');
      if(btn && h.includes(btn[0])) h=h.replace(btn[0],'');
      /* rivalidade select perto do enviar às vezes */
      const riv=h.match(/<select id="meeting-rivalry-pick"[\s\S]*?<\/select>/);
      if(riv){ h=h.replace(riv[0],''); }
      sendBlock='<div class="card" id="meeting-send-box" style="margin-top:10px">'
        +'<label class="mut">💬 Sua fala</label>'
        +ta[0]
        +(riv?riv[0]:'')
        +(btn?btn[0]:'<button class="btn o" style="width:100%;margin-top:6px" onclick="sendMeetingMessage()">Enviar</button>')
        +'</div>';
    }

    const controls=`<div class="row" id="meeting-lousa-controls" style="margin:10px 0;gap:6px;flex-wrap:wrap">`
      +`<button class="btn ${open?'':'s'}" type="button" onclick="meetingLousaToggle(true)">📋 Abrir lousa</button>`
      +`<button class="btn ${!open?'':'s'}" type="button" onclick="meetingLousaToggle(false)">🙈 Fechar lousa</button>`
      +`<button class="btn" type="button" onclick="meetingLousaRefresh()">🔄 Atualizar lousa</button>`
      +`</div>`;

    const lousa = open ? buildLousaCard(m) : '';

    /* se adder sumiu, monta um mínimo */
    if(!adder){
      const names=Object.keys(S.roster||{}).sort((a,b)=>a.localeCompare(b,'pt-BR'));
      const opts=names.map(n=>{
        const br=brandOf(n);
        return `<option value="${escHtml(n)}">${escHtml(n)} — ${escHtml(br)}</option>`;
      }).join('');
      adder=`<div id="meeting-candidate-adder" class="card" style="--c:#6a0dad;margin-top:8px"><b>➕ Adicionar candidato à lousa</b>`
        +`<div class="mut" style="margin:4px 0 7px">Escolha um nome do roster (com brand).</div>`
        +`<div class="row"><select id="meeting-v20-candidate" style="flex:1"><option value="">Escolha um lutador...</option>${opts}</select>`
        +`<button class="btn s" onclick="(window.meetingAddCandidateV22||window.meetingAddCandidateV20||function(){toast('Adder indisponível')})()">Adicionar</button></div></div>`;
    }

    /* ORDEM FINAL:
       header+mensagens (h) → INPUT → controles lousa → lousa → adder → mini → card tools → PLANO no fim */
    return h + sendBlock + controls + lousa + adder + mini + cardTools + plano;
  };

  console.log('[PLW] V26c — layout: falas → input → lousa(brand) → adder → plano no fim');
})();

/* ===== PLW MEETING V28 — decisões fechadas + multi-man inteligente ===== */
(function(){
  const C = n => typeof plwCanonicalName==='function' ? plwCanonicalName(String(n||'')) : String(n||'').trim();
  const fold = t => String(t||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\s+/g,' ').trim();

  function debate(m){
    const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : (m._st||(m._st={}));
    if(!s.debate || typeof s.debate!=='object') s.debate = {};
    const d = s.debate;
    if(!Array.isArray(d.rejected)) d.rejected = [];
    if(!Array.isArray(d.proposed)) d.proposed = [];
    if(!Array.isArray(d.liked)) d.liked = [];
    if(!Array.isArray(d.lockedMatches)) d.lockedMatches = [];
    if(!Array.isArray(d.shortlist)) d.shortlist = [];
    if(!d.topic) d.topic = '';
    if(!d.focal) d.focal = '';
    if(!d.question) d.question = '';
    if(!d.lastUser) d.lastUser = '';
    if(!d.mode) d.mode = 'discuss'; // discuss | pick | multi | locked-followup
    const addR = (n,why)=>{
      const cn=C(n); if(!cn) return;
      if(!d.rejected.some(x=>C(x.name)===cn)) d.rejected.push({name:cn, why:why||'rejeitado'});
    };
    (s.meetingDisliked||[]).forEach(n=>addR(n,'vetado na lousa'));
    (s.excluded||[]).forEach(x=>addR(x.name||x, x.why||'fora'));
    (s.meetingLiked||[]).forEach(n=>{ const cn=C(n); if(cn && !d.liked.includes(cn)) d.liked.push(cn); });
    return d;
  }

  function rosterNames(){ return Object.keys(S.roster||{}).map(C).filter(Boolean); }
  function brandOf(n){
    const w=(S.roster||{})[C(n)]||{};
    const b=String(w.brand||'').toUpperCase();
    if(b.includes('MOTION')) return 'PLW MOTION';
    if(b.includes('SHOW')) return 'PLW SHOW OFF';
    if(b.includes('WAR')) return 'PLWAR';
    return w.brand||'';
  }
  function occupied(m){
    const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : {};
    const set = new Set();
    try{
      (s.cardPairs||[]).forEach(p=>(p.names||[]).forEach(n=>set.add(C(n))));
      (s.cardMatches||[]).forEach(p=>(p.names||[]).forEach(n=>set.add(C(n))));
      (s.booked||[]).forEach(p=>(p.names||[]).forEach(n=>set.add(C(n))));
    }catch(e){}
    const d=debate(m);
    (d.lockedMatches||[]).forEach(lm=>{
      (lm.names||[]).forEach(n=>set.add(C(n)));
    });
    return set;
  }

  const VETO_RX = /\b(nao|n[aã]o)\s+(pode|rola|serve|quero|da|d[aá])|vet(o|amos|ar)|fora\b|esquece|descarta|tira |n\s*da|n[aã]o\s+da|nao\s+pode\s+ser|n[aã]o\s+pode\s+ser|rejeit/i;
  const ASK_OPP_RX = /quem\s+(deve|vai|pode)\s+(lutar|enfrentar)|advers[aá]rio|oponente|contra\s+quem|desafiante/i;
  const MULTI_RX = /fatal\s*4|fatal\s*four|four[\s-]*way|triple\s*threat|tripla|1\s*contender|number\s*one\s*contender|#?\s*1\s*contender|al[eé]m\s+d[oe]|que\s+nomes|quais\s+nomes|quem\s+entra|multi[\s-]?man/i;
  const LOCK_RX = /(?:^|[.!?]\s*)(?:é|eh)\s+[A-Za-zÀ-ÿ]+\s*(?:x|vs\.?|versus)\s+[A-Za-zÀ-ÿ]|fechad[oa]:|fechamos|ta\s+fechado|t[aá]\s+fechado|confirmad[oa]:|vamos\s+de\b|vai\s+lutar\s+contra|o\s+nome\s+[ée]\b|decidid[oa]:/i;

  function ppvLabel(m){ const t=String((m&&m.target)||''); return m&&m.mode==='ppv' ? t.split(' — ')[0].trim() : ''; }
  function switchFocal(m, d, s, newFocal){
    const nf=C(newFocal); if(!nf || C(d.focal||'')===nf) return false;
    d.focal=nf; d.topic='adversário de '+nf; d.shortlist=[]; d.proposed=[]; d.liked=[]; d.rejected=[]; d.question='';
    if(d.mode==='locked'||d.mode==='pick'||d.mode==='multi') d.mode='discuss';
    s.meetingTopicCandidates=[]; s.meetingLiked=[]; s.meetingDisliked=[]; s.meetingTurnBlocks=[]; s.lastShortlist=[];
    s.open={type:'opponent',focal:nf};
    console.log('[PLW] FOCO ->',nf);
    return true;
  }
  function absorbUser(m, text){
    const d = debate(m);
    const s = typeof meetingStateEnsure==='function' ? meetingStateEnsure(m) : {};
    const raw = String(text||'').trim();
    if(!raw) return d;
    d.lastUser = raw;
    let names = [];
    try{ names = (typeof resolveRosterMentions==='function'?resolveRosterMentions(raw):[]).map(C).filter(Boolean); }catch(e){}

    if(s.open && s.open.focal && C(s.open.focal)!==C(d.focal||'')) switchFocal(m, d, s, s.open.focal);
    else if(names.length===1 && /(precisamos|preciso|quero|falta|vaga|algu[eé]m|lutador|nome)[^.!?\n]{0,60}(enfrentar|lutar|contra)|(enfrentar|contra)\s+(o\s+|a\s+)?\S+/i.test(raw) && C(names[0])!==C(d.focal||'') && !VETO_RX.test(raw) && !(d.lockedMatches||[]).some(lm=>(lm.names||[]).map(C).includes(C(names[0])) && /fechad/i.test(raw))) switchFocal(m, d, s, names[0]);

    /* shortlist explícita: "Zack, Místico e GUNTHER" */
    if(names.length>=2 && /(qual|favorito|entre|desses|destes|plwar)/i.test(raw)){
      d.shortlist = names.filter(n=>!(d.focal&&C(n)===C(d.focal)));
      d.mode = 'pick';
    }

    if(ASK_OPP_RX.test(raw) || /contra\s+/i.test(raw)){
      d.question = raw.slice(0,280);
      if(s.open&&s.open.focal) d.focal = C(s.open.focal);
      else {
        const m1 = raw.match(/contra\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{2,40})/i);
        if(m1){
          try{ const hit=(typeof resolveRosterMentions==='function'?resolveRosterMentions(m1[1]):[])[0]; if(hit) d.focal=C(hit);}catch(e){}
        }
        if(!d.focal && names.length) d.focal = names[names.length-1];
      }
      if(d.focal){ d.topic = 'adversário de '+d.focal; s.open=s.open||{focal:d.focal}; s.open.focal=d.focal; }
      if(!MULTI_RX.test(raw)) d.mode = d.mode==='pick'?'pick':'discuss';
    }

    /* lock decision: "É GUNTHER o nome" / "GUNTHER vai lutar contra Moxley" */
    if(LOCK_RX.test(raw) && !/(?:^|\s)n[aã]o\s+(?:quero|pode|vai|d[aá])/i.test(raw) && !/\?\s*$/.test(raw)){
      const a = names.find(n=>!d.focal || C(n)!==C(d.focal)) || names[0];
      const b = d.focal || names.find(n=>C(n)!==C(a));
      if(a && b){
        const key = [C(a),C(b)].sort().join('|');
        if(!d.lockedMatches.some(x=>x.key===key)){
          d.lockedMatches.push({key, names:[C(a),C(b)], event:ppvLabel(m), note:'fechado pelo head booker'});
        }
        d.liked = [...new Set((d.liked||[]).concat([C(a)]))];
        /* don't reject the locked challenger */
        d.rejected = d.rejected.filter(r=>C(r.name)!==C(a));
        d.topic = C(a)+' x '+C(b)+' FECHADO';
      }
    }

    if(MULTI_RX.test(raw)){
      d.mode = 'multi';
      d.question = raw.slice(0,280);
      /* if gunther locked vs moxley, focal for F4W is contender match not the PPV main */
    }

    if(VETO_RX.test(raw) || /\b(nao|n[aã]o)\b.*\b(pode|quero|da|d[aá])\b/i.test(raw)){
      names.forEach(n=>{
        if(d.focal && C(n)===C(d.focal)) return;
        if(d.lockedMatches.some(lm=>(lm.names||[]).map(C).includes(C(n)))) return; // don't reject locked
        if(!d.rejected.some(x=>C(x.name)===C(n))) d.rejected.push({name:C(n), why:'rejeitado pelo head booker'});
        if(s.meetingDisliked && !s.meetingDisliked.map(C).includes(C(n))) s.meetingDisliked.push(C(n));
        if(s.excluded && !s.excluded.some(x=>C(x.name||x)===C(n))) s.excluded.push({name:C(n), why:'rejeitado'});
        d.proposed = (d.proposed||[]).filter(x=>C(x)!==C(n));
        d.shortlist = (d.shortlist||[]).filter(x=>C(x)!==C(n));
      });
    }

    const noBe = raw.match(/(?:nao|n[aã]o)\s+pode\s+ser\s+([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s'\.\-]{1,40})/ig);
    if(noBe){
      noBe.forEach(chunk=>{
        try{
          (typeof resolveRosterMentions==='function'?resolveRosterMentions(chunk):[]).map(C).forEach(n=>{
            if(d.focal && C(n)===C(d.focal)) return;
            if(!d.rejected.some(x=>C(x.name)===C(n))) d.rejected.push({name:C(n), why:'proibido'});
            if(s.meetingDisliked && !s.meetingDisliked.map(C).includes(C(n))) s.meetingDisliked.push(C(n));
          });
        }catch(e){}
      });
    }
    return d;
  }

  function multiCandidates(m, d, brandWanted){
    const occ = occupied(m);
    const rej = new Set(d.rejected.map(r=>C(r.name)));
    const locked = new Set();
    (d.lockedMatches||[]).forEach(lm=>(lm.names||[]).forEach(n=>locked.add(C(n))));
    const want = fold(brandWanted||'plwar');
    let pool = rosterNames().filter(n=>{
      if(occ.has(C(n)) && !locked.has(C(n))) return false; // occupied unless already in locked match as gunther-style exception for F4W seed
      if(rej.has(C(n))) return false;
      if(d.focal && C(n)===C(d.focal)) return false;
      const br = fold(brandOf(n));
      if(want.includes('plwar') || want.includes('war')) return br.includes('war');
      if(want.includes('motion')) return br.includes('motion');
      if(want.includes('show')) return br.includes('show');
      return true;
    });
    /* prefer not repeating locked main-event opponent as "new" names beyond the one seeded */
    /* score lightly by presence in shortlist */
    const prefer = new Set((d.shortlist||[]).map(C).concat((d.proposed||[]).map(C)));
    pool.sort((a,b)=>(prefer.has(C(b))?1:0)-(prefer.has(C(a))?1:0) || a.localeCompare(b));
    return pool.slice(0,12);
  }

  function stateBlock(m, plan){
    const d = debate(m);
    const locked = (d.lockedMatches||[]).map(lm=>(lm.names||[]).join(' x ')+(lm.event?' @ '+lm.event:'')).join(' | ') || '(nenhuma)';
    const rej = d.rejected.map(x=>x.name).join(', ') || '(nenhum)';
    const short = (d.shortlist||[]).join(', ') || '(nenhuma)';
    const multi = d.mode==='multi' ? multiCandidates(m, d, 'PLWAR').slice(0,8).join(', ') : '';
    const cands = (plan && plan.cands || []).map(c=>c.name).filter(n=>!d.rejected.some(r=>C(r.name)===C(n)));
    return [
      '=== ESTADO DA REUNIÃO (contínuo) ===',
      'Modo atual: '+d.mode,
      'Tópico: '+(d.topic||'(em aberto)'),
      'Focal: '+(d.focal||'—'),
      'Pergunta aberta: '+(d.question||d.lastUser||'—'),
      'LUTAS FECHADAS (NÃO reabrir, NÃO trocar o oponente): '+locked,
      'REJEITADOS (proibido sugerir): '+rej,
      'Shortlist do head booker: '+short,
      'Candidatos válidos (singles): '+(cands.slice(0,10).join(', ')||'—'),
      (d.mode==='multi'?'Candidatos para multi-man / F4W (além dos já fechados): '+multi:''),
      'Última fala do head booker: "'+String(d.lastUser||'').slice(0,320)+'"',
      '',
      'REGRAS:',
      '- Se há luta FECHADA, aceite e responda a NOVA pergunta (ex.: nomes da F4W), sem revotar o main event.',
      '- Em Fatal 4-Way / 1 contender: entregue NOMES concretos (3 além do já confirmado), da brand pedida.',
      '- Nunca diga "head booker corrigiu/disse". Nunca narre veto.',
      '- Analista não booka. Creative não fecha card sozinha.',
      '- 2 a 4 frases.'
    ].filter(Boolean).join('\n');
  }

  function roleTask(key, d, plan, round){
    const F = d.focal || (plan&&plan.F) || '';
    const lockedOpp = (d.lockedMatches||[]).map(lm=>(lm.names||[]).find(n=>C(n)!==C(F))||(lm.names||[])[0]).filter(Boolean)[0];
    const multi = multiCandidates(S.bookingMeeting||{}, d, 'PLWAR');
    const seed = lockedOpp || (d.liked||[])[0] || '';
    const others = multi.filter(n=>C(n)!==C(seed)).slice(0,6);

    if(d.mode==='multi'){
      if(key==='jj') return 'O head booker FECHOU '+(seed?seed+' no main':'a luta principal')+'. Agora ele quer NOMES para a Fatal 4-Way / 1 contender no próximo PLWAR, ALÉM de '+(seed||'quem já está')+'. Escolha 3 nomes da lista: '+(others.join(', ')||'PLWAR livres')+'. Só nomes + 1 frase de porquê. NÃO reabra o main event.';
      if(key==='gendo') return 'Sugira um lineup ousado de F4W com 3 nomes (podem diferir do J.J.) entre: '+(others.join(', ')||'PLWAR')+'. Pode incluir '+(seed||'')+' como âncora. NÃO reabra o oponente do Final Battle.';
      if(key==='tony') return 'Com a F4W, descreva em 2 frases como cada um se classifica em 1–2 shows (ataque, promo, eliminação) — sem mudar o main event fechado.';
      if(key==='hal') return 'Só confira se os nomes citados estão livres no card e na brand PLWAR. Não proponha booking novo.';
    }

    if(d.mode==='pick' && (d.shortlist||[]).length){
      const list = d.shortlist.filter(n=>!d.rejected.some(r=>C(r.name)===C(n)));
      if(key==='jj') return 'O head booker pediu o FAVORITO entre: '+list.join(', ')+'. Escolha UM e diga por quê (3 semanas de build, empresa nova de 4 meses = payoff claro).';
      if(key==='gendo') return 'Entre '+list.join(', ')+', escolha UM (pode discordar do J.J.) com lógica ousada de 3 semanas.';
      if(key==='tony') return 'Sobre o favorito da mesa, monte o build de 3 shows até o PPV — sem inventar passado.';
      if(key==='hal') return 'Compare os da shortlist só com números/históricos dos FATOS. Sem fechar luta.';
    }

    /* locked follow-up without multi already handled */
    if((d.lockedMatches||[]).length && !ASK_OPP_RX.test(d.lastUser||'')){
      if(key==='jj') return 'Há luta FECHADA: '+d.lockedMatches.map(l=>(l.names||[]).join(' x ')).join('; ')+'. Responda a pergunta nova do head booker sem reabrir isso. Se ele pediu nomes extras, dê nomes.';
    }

    const valid = (plan&&plan.cands||[]).map(c=>c.name).filter(n=>!d.rejected.some(r=>C(r.name)===C(n)));
    const pick = (round&&round.pick)||'';
    if(key==='jj') return 'Escolha UM válido'+(F?' para '+F:'')+': '+(valid.slice(0,8).join(', ')||'—')+'. Uma frase de timing.';
    if(key==='gendo') return (pick?'J.J. foi de '+pick+'. ':'')+'Concorde com twist OU outro nome: '+(valid.filter(n=>C(n)!==C(pick)).slice(0,6).join(', ')||'—')+'.';
    if(key==='tony') return 'Ângulo/stip/build de 2–3 semanas em cima de '+(pick||'a discussão')+'. Não feche card.';
    if(key==='hal') return 'Só um dado dos FATOS'+(pick?' sobre '+pick:'')+'. Não booke.';
    return 'Sua função.';
  }

  function speakersFor(text, d){
    if(d.mode==='multi') return ['jj','gendo','tony','hal'];
    if(d.mode==='pick') return ['jj','gendo','hal'];
    if(VETO_RX.test(text) && String(text).length<90) return ['jj','gendo'];
    if(/stip|angulo|ângulo|promo|segmento|build/i.test(text)) return ['tony','gendo','jj'];
    if(/n[uú]mero|rating|hist[oó]rico|dado/i.test(text)) return ['hal','jj'];
    return ['jj','gendo','tony','hal'];
  }

  const LEAK_RX = /head booker (corrigiu|errou|disse|informou|vetou|rejeitou|falou)|o head booker|n[aã]o d[aá] agora|est[aá] fora da lista calculada|j[aá] foi rejeitado/i;
  function scrubLeak(text){
    let t = String(text||'');
    t = t.split(/(?<=[.!?…])\s+/).filter(s=>!LEAK_RX.test(s)).join(' ').trim();
    if(!t || LEAK_RX.test(t)) return '';
    return t;
  }
  function recordProposal(d, text){
    try{
      (typeof resolveRosterMentions==='function'?resolveRosterMentions(text):[]).map(C).forEach(n=>{
        if(!n|| (d.focal&&C(n)===C(d.focal))) return;
        if(d.rejected.some(r=>C(r.name)===C(n))) return;
        if(!d.proposed.includes(n)) d.proposed.push(n);
      });
    }catch(e){}
  }

  const _bp = window.buildPrompt;
  if(typeof _bp==='function'){
    window.buildPrompt = function(key, plan, m, message, round, extra){
      try{
        const u=(m.messages||[]).filter(x=>x.role==='user').slice(-1)[0];
        if(u) absorbUser(m, u.text);
      }catch(e){}
      let p = _bp(key, plan, m, message, round, extra);
      const d = debate(m);
      const task = roleTask(key, d, plan, round||{});
      p = p.replace(/SUA TAREFA AGORA:[\s\S]*?(?=REGRA DE CONTINUIDADE:|# IDENTIDADE|Responda somente|$)/, 'SUA TAREFA AGORA: '+task+'\n');
      p += '\n\n'+stateBlock(m, plan)+'\n\n# V28\nResponda só na sua função. Não reabra luta fechada. Se modo multi, entregue nomes.\n';
      if(extra) p += '\n'+extra;
      return p;
    };
  }

  const _ct = window.checkText;
  if(typeof _ct==='function'){
    window.checkText = function(text, plan, key){
      let issues=[];
      try{ issues=_ct(text,plan,key)||[]; }catch(e){}
      if(key==='hal'||key==='tony') issues=issues.filter(x=>!/Escolha UM dos CANDIDATOS/i.test(String(x)));
      if(LEAK_RX.test(String(text||''))) issues.push('Não narre correção/veto.');
      try{
        const d=debate(S.bookingMeeting||{});
        const used=(typeof resolveRosterMentions==='function'?resolveRosterMentions(text):[]).map(C);
        const bad=used.filter(n=>d.rejected.some(r=>C(r.name)===C(n)));
        if(bad.length && key!=='hal' && !/fora|vetad|rejeit/i.test(fold(text))) issues.push('Não sugira rejeitados: '+bad.join(', '));
        /* if multi mode and jj/gendo, must mention at least 2 names */
        if(d.mode==='multi' && (key==='jj'||key==='gendo')){
          const multiNames = used.filter(n=>!d.focal||C(n)!==C(d.focal));
          if(multiNames.length<2) issues.push('Cite pelo menos 2 nomes concretos para a multi-man/F4W.');
        }
        /* if locked match, jj shouldn't push a different main event opponent */
        if((d.lockedMatches||[]).length && key==='jj' && d.mode!=='multi'){
          const lockedAll = new Set();
          d.lockedMatches.forEach(lm=>(lm.names||[]).forEach(n=>lockedAll.add(C(n))));
          const newOpp = used.filter(n=>d.focal&&C(n)!==C(d.focal)&&!lockedAll.has(C(n)));
          if(newOpp.length && /final\s*battle|contra\s+moxley|enfrentar\s+moxley/i.test(fold(text))){
            issues.push('Main event já fechado. Não proponha outro oponente para o PPV; responda a pergunta atual.');
          }
        }
      }catch(e){}
      return issues;
    };
  }

  window.meetingRunPanel = async function(phase, userText){
    const meeting = S.bookingMeeting;
    if(!meeting) return;
    if(busy) return toast('Espere as vozes terminarem.');

    const raw = userText!=null ? String(userText).trim() : '';
    if(raw) absorbUser(meeting, raw);
    else {
      const u=(meeting.messages||[]).filter(x=>x.role==='user').slice(-1)[0];
      if(u) absorbUser(meeting, u.text);
    }
    const d = debate(meeting);
    busy = true; window.__mtgRunning = true;
    const token = meeting.runId = String(Date.now())+':'+Math.random().toString(36).slice(2);

    try{
      let latest = raw || d.lastUser || '';
      let plan = null;
      try{
        if(typeof window.buildPlan==='function') plan = window.buildPlan(meeting, latest);
        else if(typeof buildPlan==='function') plan = buildPlan(meeting, latest);
      }catch(e){ console.error(e); }
      if(!plan) plan = {text:latest, F:d.focal, cands:[], intent:d.mode==='multi'?'discuss':'opponent', factsTxt:'', board:'', candTxt:'', un:new Map()};

      const rej = new Set(d.rejected.map(r=>C(r.name)));
      plan.cands = (plan.cands||[]).filter(c=>!rej.has(C(c.name)));
      if(plan.F) d.focal = d.focal || plan.F;

      /* inject multi candidates into plan for prompts */
      if(d.mode==='multi'){
        const mc = multiCandidates(meeting, d, 'PLWAR');
        plan.cands = mc.map(n=>({name:n, reason:n+' ['+(brandOf(n)||'?')+']', plain:n+' — '+brandOf(n)}));
        plan.candTxt = 'CANDIDATOS F4W/PLWAR:\n'+plan.cands.map((c,i)=>(i+1)+') '+c.reason).join('\n');
        plan.intent = 'discuss';
      }

      const keys = speakersFor(latest, d);
      const round = {said:[], pick: (d.liked&&d.liked[0])||''};
      const LBL = {jj:'J.J. PURPLE', tony:'CREATIVE ROOM', gendo:'GENDO IKARI', hal:'ANALISTA'};

      for(const key of keys){
        if(S.bookingMeeting!==meeting || meeting.runId!==token) break;
        const message = {role:'persona', persona:key, text:'…', id:Date.now()+meeting.messages.length};
        meeting.messages.push(message);
        persist(); if(tab==='meeting') render();

        let output='';
        const gen = async (extra)=>{
          output='';
          const prompt = typeof window.buildPrompt==='function'
            ? window.buildPrompt(key, plan, meeting, message, round, extra)
            : stateBlock(meeting, plan)+'\n'+roleTask(key, d, plan, round);
          const sys = (typeof bookerSystem==='function'?bookerSystem(key):'')
            + '\n\n# V28\nNão reabra luta fechada. Em multi-man entregue nomes. Sem narrar veto. Analista não booka.';
          await bookerSample(prompt,{
            engine:K.engine, system:sys, maxTok:key==='hal'?400:700,
            onText:c=>{ if(meeting.runId!==token)return; output=typeof removeRepeatedResponseText==='function'?removeRepeatedResponseText(c.text):c.text; message.text=output||'…'; }
          });
          return output;
        };

        let text = await gen('');
        let issues=[];
        try{ if(typeof window.checkText==='function') issues=window.checkText(text,plan,key)||[]; }catch(e){}
        if(issues.length && meeting.runId===token){
          message.text='…';
          text = await gen('CORREÇÃO: '+issues.join(' ')+' Responda a pergunta atual com nomes concretos se for multi-man.');
          try{ issues=window.checkText(text,plan,key)||[]; }catch(e){ issues=[]; }
        }
        text = scrubLeak(text);
        if(!text){
          const valid = (plan.cands||[]).map(c=>c.name);
          const a=valid[0], b=valid[1], c3=valid[2];
          if(d.mode==='multi'){
            if(key==='jj'||key==='gendo') text = 'Além do confirmado, eu colocaria '+[a,b,c3].filter(Boolean).join(', ')+' na F4W do PLWAR.';
            else if(key==='tony') text = 'Build: cada um ganha um momento em 1 dos 3 shows — ataque, promo ou luta classificatória — e colidem na F4W.';
            else text = 'Os três estão livres na PLWAR no que o card mostra agora.';
          } else {
            if(key==='jj') text = a?('Eu iria de '+a+'.'):'Lista apertada.';
            else if(key==='gendo') text = b?('Eu arriscaria '+b+'.'):(a?('Compro '+a+' com twist.'):'Mudo a estrutura.');
            else if(key==='tony') text = 'Build curto: encontro, provocação, choque no PPV.';
            else text = a?('Pelos números, '+a+' é o que o save sustenta.'):'Sem dado novo.';
          }
        }
        if(typeof finalizeText==='function'){
          const fin=finalizeText(text); message.text=fin.shown||text; message.rest=fin.rest; message.cut=!!fin.rest;
        } else message.text=text;

        recordProposal(d, message.text);
        if(key==='jj'||key==='gendo'){
          try{
            const named=(plan.cands||[]).find(c=>fold(message.text).includes(fold(c.name)));
            if(named && !rej.has(C(named.name))) round.pick = named.name;
          }catch(e){}
        }
        round.said.push((LBL[key]||key)+': '+message.text);
        persist(); if(tab==='meeting') render();
      }
      try{ if(typeof meetingTrackPersonaIdeas==='function') meetingTrackPersonaIdeas(meeting); }catch(e){}
    }catch(err){
      meeting.messages=(meeting.messages||[]).filter(x=>!(x.role==='persona'&&x.text==='…'));
      meeting.messages.push({role:'system', text:'Erro na reunião: '+(err.message||err.code||err)});
    }finally{
      busy=false; window.__mtgRunning=false; persist(); if(tab==='meeting') render();
    }
  };

  const _mu = window.meetingUpdateFromUser;
  if(typeof _mu==='function'){
    window.meetingUpdateFromUser=function(m,text){ try{absorbUser(m,text);}catch(e){} return _mu.apply(this,arguments); };
  }

  console.log('[PLW] Meeting V28 — lock de decisão + F4W/multi-man com nomes');
})();

/* ===== PLW V29 — restaura MINI-CARD sempre visível na reunião ===== */
(function(){
  function rebuildMini(m){
    if(typeof window.miniHTML==='function'){
      try{ return window.miniHTML(m); }catch(e){ console.warn('miniHTML',e); }
    }
    /* fallback mínimo se miniHTML sumiu do escopo */
    try{

      const body = rows.length
        ? rows.map((r,i)=>`<div class="row" style="border-bottom:1px solid rgba(255,255,255,.08);padding:7px 0"><div style="flex:1"><b>${i+1}.</b> ${(r.names||[]).join(' × ')}${r.title?' • 🏆 '+r.title:''}${r.st?' • '+r.st:''}</div>${m.confirmedAt?'':`<button class="btn r" style="padding:3px 10px" onclick="meetingMiniDeleteV8('${r.key}')">✕</button>`}</div>`).join('')
        : '<div class="mut">Nenhuma luta no card ainda. Grava abaixo ou cita na conversa.</div>';
      return `<details class="card" open id="meeting-mini-card-v29" style="--c:#6a0dad;margin-top:10px"><summary><b>📋 MINI-CARD — contexto da sala</b><span class="mut"> — as vozes leem isto</span></summary>`
        +`<div class="mut" style="margin:7px 0">PPV: <b>${ppv}</b> • sincronizado com a reunião</div>`
        +`<div id="meeting-mini-rows-v8">${body}</div>`
        + (m.confirmedAt?'':`<div class="row" style="margin-top:10px"><select id="meeting-mini-type-v8" onchange="meetingMiniInitV8()" style="flex:0 0 150px"><option value="singles">1 × 1</option><option value="triple">Triple Threat</option><option value="fatal4">Fatal 4-Way</option></select><div id="meeting-mini-slots-v8" class="row" style="flex:1;gap:6px"></div></div>`
          +`<div class="row" style="margin-top:7px"><input id="meeting-mini-st-v8" placeholder="Estipulação (opcional)" style="flex:1"><select id="meeting-mini-title-v8" style="flex:1"><option value="">🏆 Sem título</option>${(typeof TITLES!=='undefined'?TITLES:[]).map(t=>`<option value="${t[0]}">${t[0]}</option>`).join('')}</select><button class="btn g" onclick="meetingMiniAddV8()">➕ Gravar luta</button></div>`)
        +`<div class="row" style="margin-top:8px"><button class="btn s" onclick="meetingMiniSyncV8()">🔄 Atualizar memória do card</button></div>`
        +`</details>`;
    }catch(e){
      return '<div class="card" id="meeting-mini-card-v29"><b>📋 MINI-CARD</b><div class="mut">Indisponível neste render.</div></div>';
    }
  }

  const _v = window.vMeeting;
  window.vMeeting = function(){
    let h = _v ? _v() : '';
    const m = S.bookingMeeting;
    if(!m) return h;

    /* se já tem mini-card intacto, ok; senão injeta */
    const hasMini = h.includes('MINI-CARD') && (h.includes('meeting-mini-rows-v8') || h.includes('meeting-mini-card-v29'));
    if(!hasMini){
      const mini = rebuildMini(m);
      /* colocar depois da lousa/adder, antes do PLANO */
      const plano = h.search(/PLANO E DECIS/);
      if(plano > 0){
        const back = h.lastIndexOf('<div', plano);
        h = h.slice(0, back>=0?back:plano) + mini + h.slice(back>=0?back:plano);
      } else {
        h = h + mini;
      }
    }

    /* garante open no details do mini */
    h = h.replace(/<details class="card"([^>]*)>\s*<summary><b>📋 MINI-CARD/,
      '<details class="card" open$1><summary><b>📋 MINI-CARD');

    setTimeout(function(){
      try{
        if(document.getElementById('meeting-mini-slots-v8') && typeof meetingMiniInitV8==='function')
          meetingMiniInitV8();
      }catch(e){}
    }, 0);
    return h;
  };

  console.log('[PLW] V29 — MINI-CARD restaurado');
})();


/* ===== PLW V31 — lápis OK + lousa da sala (abrir/fechar) + enviar abaixo + brand + aviso texto ===== */
(function(){
  function C(n){ return typeof plwCanonicalName==='function'?plwCanonicalName(String(n||'')):String(n||'').trim(); }
  function keyOf(ns){ return (ns||[]).filter(Boolean).map(C).sort().join('|'); }
  function brandKey(n){
    var w=(S.roster||{})[C(n)]||{};
    var b=String(w.brand||'').toUpperCase();
    if(b.indexOf('MOTION')>=0) return 'MOTION';
    if(b.indexOf('SHOW')>=0) return 'SHOW OFF';
    if(b.indexOf('WAR')>=0) return 'PLWAR';
    return '';
  }
  function titleBrand(title){
    if(!title) return 'ANY';
    var u=String(title).toUpperCase();
    if(u.indexOf('WORLD')>=0) return 'GLOBAL';
    if(u.indexOf('SHOW OFF')>=0||u.indexOf('SHOWOFF')>=0) return 'SHOW OFF';
    if(u.indexOf('MOTION')>=0||u.indexOf('NEXT LEVEL')>=0||u.indexOf('RISING')>=0) return 'MOTION';
    if(u.indexOf('CROWN')>=0||u.indexOf('ACE')>=0||u.indexOf('PLWAR')>=0) return 'PLWAR';
    return 'ANY';
  }

  /* ---- ✏️ editar luta no mini-card ---- */

        '<div class="row" style="flex-wrap:wrap;gap:6px">'+slots+'</div>'+

        '</div>';

      var host = document.getElementById('meeting-mini-rows-v8');

      document.getElementById('mini-edit-save').onclick = function(){
        var sels = wrap.querySelectorAll('select.mini-edit-p');
        var out = [];
        for(var i=0;i<sels.length;i++){ var v=C(sels[i].value); if(v) out.push(v); }

        var need = titleBrand(newTitle);
        if(need && need!=='GLOBAL' && need!=='ANY'){
          var bad = out.filter(function(n){ return brandKey(n)!==need; });
          if(bad.length){ toast('Título exige brand '+need+'. Fora: '+bad.join(', ')); return; }
        }
        var newKey = keyOf(out);
        if(!Array.isArray(s.cardMatches)) s.cardMatches=[];
        if(!Array.isArray(s.cardPairs)) s.cardPairs=[];
